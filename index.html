<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동선짜기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --sea: #c2dff0;
  --land: #e4efdc;
  --land-edge: #a4bdaa;
  --border: #9ab4a8;
  --grid: rgba(20, 60, 90, .10);
  --ink: #10283a;
  --ink-2: #47617a;
  --panel: rgba(255, 255, 255, .9);
  --panel-solid: #ffffff;
  --line: rgba(16, 40, 58, .18);
  --field: rgba(60, 100, 140, .09);
  --accent: #e11d48;
  --on-accent: #ffffff;
  --focus: #1d5fd1;
  --err: #c0271b;
  --warn: #8a5a00;
  --ok: #17703f;
  --c-plane: #0b7dc4;
  --c-train: #c77700;
  --c-subway: #7b4fd6;
  --c-tram: #0f9d8f;
  --c-bus: #1f9e4b;
  --c-walk: #5b6b78;
  --c-taxi: #d9a400;
  --c-ship: #2d6fd6;
  --display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0a2138;
    --land: #1b4560;
    --land-edge: #2f6f8f;
    --border: rgba(140, 200, 225, .38);
    --grid: rgba(160, 210, 240, .08);
    --ink: #e8f3fb;
    --ink-2: #9db8cb;
    --panel: rgba(8, 28, 48, .88);
    --panel-solid: #0c2a45;
    --line: rgba(180, 215, 240, .2);
    --field: rgba(160, 200, 235, .1);
    --accent: #ffd23f;
    --on-accent: #10283a;
    --focus: #7fb2ff;
    --err: #ff9a8f;
    --warn: #ffd27a;
    --ok: #7be0a5;
    --c-plane: #5ccbff;
    --c-train: #ffb84d;
    --c-subway: #b99cff;
    --c-tram: #3fe0cf;
    --c-bus: #63e08f;
    --c-walk: #dbe6ee;
    --c-taxi: #ffe45c;
    --c-ship: #7db4ff;
  }
}
:root[data-theme="dark"] {
  --sea: #0a2138;
  --land: #1b4560;
  --land-edge: #2f6f8f;
  --border: rgba(140, 200, 225, .38);
  --grid: rgba(160, 210, 240, .08);
  --ink: #e8f3fb;
  --ink-2: #9db8cb;
  --panel: rgba(8, 28, 48, .88);
  --panel-solid: #0c2a45;
  --line: rgba(180, 215, 240, .2);
  --field: rgba(160, 200, 235, .1);
  --accent: #ffd23f;
  --on-accent: #10283a;
  --focus: #7fb2ff;
  --err: #ff9a8f;
  --warn: #ffd27a;
  --ok: #7be0a5;
  --c-plane: #5ccbff;
  --c-train: #ffb84d;
  --c-subway: #b99cff;
  --c-tram: #3fe0cf;
  --c-bus: #63e08f;
  --c-walk: #dbe6ee;
  --c-taxi: #ffe45c;
  --c-ship: #7db4ff;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--sea); color: var(--ink);
  font-family: var(--body); font-size: 14px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; overflow: clip; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; background: var(--sea); font-family: var(--body); }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; display: block; }
.leaflet-top { top: var(--hudt, 0px); }
.leaflet-bottom { bottom: var(--hudb, 0px); }
.leaflet-control-attribution { font-size: 11px; }

/* 상단 */
#hudTop {
  position: absolute; left: 0; right: 0; top: 0; z-index: 2;
  padding: 10px 12px 0; display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#title {
  margin: 0; font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.2;
  background: var(--panel); border: 1px solid var(--line);
  padding: 6px 14px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.pill-btn {
  pointer-events: auto; cursor: pointer; flex: none;
  background: var(--accent); color: var(--on-accent); border: 0;
  padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 13px;
}
.capline { display: flex; align-items: center; gap: 8px; }
#caption {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 12px; font-weight: 600; font-size: 13.5px; min-width: 0; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
#legCount {
  flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 10px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.hudbtns { display: flex; gap: 6px; flex: none; pointer-events: none; }
.hudbtns .pill-btn { pointer-events: auto; }
/* 선택/검색/3D 묶음: 넓은 화면에서는 그냥 나란히(각 버튼 그대로), 좁은 화면에서는 '설정' 버튼 하나로 접는다 */
.settings-wrap { display: contents; }
.settings-menu { display: contents; }
.settings-menu[hidden] { display: contents; }
#settingsBtn { display: none; }
@media (max-width: 520px) {
  .row { flex-wrap: wrap; row-gap: 6px; }
  #title { flex: 1 1 100%; font-size: 16px; padding: 6px 10px; }
  .hudbtns { flex: 1 1 100%; flex-wrap: wrap; gap: 8px; justify-content: flex-start; }
  .hudbtns .pill-btn {
    padding: 9px 12px; font-size: 12.5px; min-height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .settings-wrap { display: inline-flex; position: relative; pointer-events: none; }
  #settingsBtn { display: inline-flex; pointer-events: auto; }
  .settings-menu {
    display: flex; flex-direction: column; gap: 8px;
    position: absolute; top: calc(100% + 8px); left: 0; min-width: 170px; z-index: 6;
    background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.2); pointer-events: auto;
  }
  .settings-menu[hidden] { display: none; }
  .settings-menu .pill-btn { width: 100%; }
  .settings-menu #searchBtn::after { content: ' 검색'; }
}

/* 장소 검색 */
#searchPanel {
  position: absolute; left: 12px; right: 12px; top: var(--hudt, 60px); z-index: 5;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px; max-height: min(60vh, 420px); overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.2);
}
#searchPanel[hidden] { display: none; }
@media (min-width: 820px) { #searchPanel { left: 12px; right: auto; width: 340px; } }
.srow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; position: sticky; top: 0; background: var(--panel-solid); }
#searchInput {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px;
  background: var(--field); padding: 8px 10px;
}
#searchResults { display: flex; flex-direction: column; gap: 4px; }
#searchResults button {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; cursor: pointer;
  border: 1px solid var(--line); background: var(--field); border-radius: 10px; padding: 8px 10px; font-size: 13px;
}
#searchResults button:hover { background: var(--panel); }
.sr-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sr-when { flex: none; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
#searchEmpty { font-size: 12.5px; color: var(--ink-2); padding: 6px 2px; margin: 0; }

/* 하단 */
#hudBottom {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
#days {
  display: flex; gap: 6px; overflow-x: auto; pointer-events: auto; padding: 2px 0;
  scrollbar-width: none;
}
#days::-webkit-scrollbar { display: none; }
.chip {
  flex: none; cursor: pointer; border: 1px solid var(--line); background: var(--panel);
  border-radius: 8px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink);
}
.chip[aria-current="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
#controls {
  pointer-events: auto; display: flex; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 8px 10px;
}
.ibtn {
  flex: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; font-size: 16px; line-height: 1;
  display: grid; place-items: center;
}
.auto {
  flex: none; cursor: pointer; height: 40px; padding: 0 12px; border-radius: 12px;
  border: 1px solid var(--line); background: transparent; font-weight: 600; font-size: 13px;
}
.auto[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
#events {
  flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; padding: 2px;
  scroll-snap-type: x proximity; scrollbar-width: none;
}
#events::-webkit-scrollbar { display: none; }
.ev {
  flex: none; scroll-snap-align: center; min-width: 112px; max-width: 176px; text-align: left; cursor: pointer;
  border: 1px solid var(--line); background: var(--field); border-radius: 12px; padding: 6px 10px;
  display: flex; flex-direction: column; gap: 1px;
}
.ev .t { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ev .n { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .d { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev[aria-current="true"] .d { color: inherit; }
.ev.done { opacity: .62; }
/* 장소 박스 사이의 이동 표시 */
.lk {
  flex: none; align-self: center; cursor: pointer; border: 0; background: transparent; color: var(--ink-2);
  display: flex; flex-direction: column; align-items: center; gap: 0; padding: 2px 2px; font-size: 11.5px; line-height: 1.35;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.lk .m { font-weight: 600; }
.lk.done { opacity: .62; }
.lk[aria-current="true"] { color: var(--accent); opacity: 1; }
.lk[aria-current="true"] .m { text-decoration: underline; text-underline-offset: 3px; }
.ev[aria-current="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; opacity: 1; }
.ev[aria-current="true"] .t { color: inherit; }
.ibtn { width: 36px; height: 44px; border-radius: 10px; font-size: 13px; }
@media (max-width: 520px) {
  /* 하단 컨트롤: 이벤트 목록을 한 줄로 올리고, 이전/자동/다음 버튼은 아래 줄에 여유 있게 배치 */
  #controls { flex-wrap: wrap; justify-content: center; gap: 10px 16px; padding: 10px 12px; }
  #events { order: -1; flex: 1 1 100%; }
  #prev, #next { width: 48px; height: 48px; }
  .auto { height: 48px; padding: 0 20px; font-size: 13.5px; }
}

/* 일차 카드 */
#dayCard {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--hudb, 138px) + 14px); z-index: 3; text-align: center; pointer-events: none;
  transform: translate(-50%, 12px) scale(.94); opacity: 0;
  transition: opacity .35s ease, transform .35s ease;
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  padding: 12px 26px 14px; width: max-content; max-width: 88%;
}
#dayCard.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
#dcTitle { font-family: var(--display); font-size: 36px; line-height: 1.1; color: var(--accent); margin: 0; white-space: nowrap; }
#dcSub { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
#dcSub:empty { display: none; }

/* 장소 정보 카드 */
#placeInfo {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 7;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px;
  width: min(340px, calc(100% - 32px)); max-height: 70vh; overflow-y: auto;
  box-shadow: 0 14px 40px rgba(0,0,0,.28); padding: 14px;
}
#placeInfo[hidden] { display: none; }
.pi-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.pi-head h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 19px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#piImg { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; background: var(--field); display: block; margin-bottom: 10px; }
#piText { font-size: 13.5px; line-height: 1.6; color: var(--ink); margin: 0 0 8px; white-space: pre-line; }
#piLink { font-size: 12.5px; font-weight: 600; color: var(--focus); text-decoration: none; }
#piLink:hover { text-decoration: underline; }

/* 도시별 지도 */
#cityView {
  position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column;
  background: var(--panel-solid); color: var(--ink);
}
#cityView[hidden] { display: none; }
.cv-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
.cv-head h2 { margin: 0; flex: 1; min-width: 0; font-family: var(--display); font-weight: 400; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cvCountry { min-width: 0; max-width: 46%; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 7px 8px; font-weight: 600; }
#cvClose { width: 36px; height: 36px; font-size: 18px; flex: none; }
#cvCities { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 2px 12px 8px; scrollbar-width: thin; }
.cv-chip {
  flex: none; cursor: pointer; border: 1px solid var(--line); background: var(--field); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap;
}
.cv-chip small { font-weight: 400; color: var(--ink-2); margin-left: 4px; }
.cv-chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.cv-chip[aria-pressed="true"] small { color: inherit; opacity: .85; }
.cv-body { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
#cvMap { flex: 1 1 62%; min-height: 0; background: #fdf5df; font-family: var(--body); }
#cvList { flex: 0 0 38%; overflow-y: auto; overscroll-behavior: contain; padding: 8px 10px 14px; }
@media (min-width: 820px) {
  .cv-body { flex-direction: row; }
  #cvMap { flex: 1; }
  #cvList { flex: 0 0 400px; border-left: 1px solid var(--line); }
}
.cv-listhead { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; font-size: 12.5px; color: var(--ink-2); }
.cv-listhead strong { color: var(--ink); font-size: 14px; margin-right: auto; }
.cv-day { display: inline-flex; align-items: center; gap: 4px; }
.cv-day i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.cv-note { margin: 0 0 8px; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.cv-empty { font-size: 13px; color: var(--ink-2); padding: 10px 2px; margin: 0; line-height: 1.6; }

/* 사진 카드 목록 */
.cv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 819px) { .cv-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .cv-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cv-item {
  display: flex; flex-direction: column; text-align: left; cursor: pointer; padding: 0; overflow: hidden;
  border: 1px solid var(--line); background: var(--field); border-radius: 12px;
}
.cv-item:hover, .cv-item.on { background: var(--panel); border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.cv-thumb { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #dde5ee; }
.cv-img { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.cv-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cv-img .cv-fbe { font-size: 34px; }
.cv-thumb .cv-dot { position: absolute; left: 7px; top: 7px; }
.cv-item .t { padding: 6px 8px 8px; min-width: 0; }
.cv-item .t b { display: block; font-size: 13px; line-height: 1.3; }
.cv-item .t span { display: block; font-size: 11.5px; color: var(--ink-2); line-height: 1.4; margin-top: 1px; }

/* 일차 색 점(카드용) */
.cv-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }

/* 지도 위 사진 핀: 동그란 사진 + 아래 뾰족한 끝이 실제 위치를 가리킨다(끝이 좌표) */
.cv-mk { width: 64px; height: 76px; cursor: pointer; }
.maplibregl-marker:hover { z-index: 5; }
.cv-pin { position: relative; width: 64px; height: 76px; }
.cv-pbody { position: absolute; inset: 0; transform-origin: 50% 100%; transform: scale(var(--ps, 1)); animation: cv-pop .6s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: calc(var(--i, 0) * 90ms); }
@keyframes cv-pop { from { transform: scale(0); opacity: 0; } to { transform: scale(var(--ps, 1)); opacity: 1; } }
.cv-card {
  position: absolute; left: 0; top: 0; z-index: 1; width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; overflow: hidden; background: #dde5ee;
  box-shadow: 0 2px 8px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center;
}
.cv-tip { position: absolute; left: 50%; top: 58px; width: 14px; height: 14px; margin-left: -7px; transform: rotate(45deg); border-radius: 0 0 3px 0; box-shadow: 2px 2px 4px rgba(0,0,0,.35); }
.cv-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cv-fbe { font-size: 28px; line-height: 1; }
.cv-shadow { position: absolute; left: 50%; bottom: -3px; width: 30px; height: 9px; margin-left: -15px; border-radius: 50%; background: rgba(60, 40, 90, .28); filter: blur(1.5px); }
.cv-lbl {
  position: absolute; z-index: 2; pointer-events: none;
  background: #fff; color: #3b2f6b; border: 2px solid #fff; border-radius: 999px;
  padding: 1px 10px; font-size: 12.5px; font-weight: 800; white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 2px 6px rgba(60, 40, 90, .35);
}
/* 핀이 --ps 배율로 줄어도(끝을 기준으로 줄어든다) 이름표가 핀 가장자리에 붙도록 같은 배율로 자리를 계산 */
.cv-lbl, .cv-lbl[data-pos="b"] { top: 100%; left: 50%; bottom: auto; right: auto; transform: translateX(-50%); margin: 3px 0 0; }
.cv-lbl[data-pos="t"] { top: auto; bottom: calc(var(--ps, 1) * 76px + 3px); left: 50%; transform: translateX(-50%); margin: 0; }
.cv-lbl[data-pos="r"] { top: calc(76px - var(--ps, 1) * 44px); left: calc(32px + var(--ps, 1) * 32px + 4px); bottom: auto; transform: translateY(-50%); margin: 0; }
.cv-lbl[data-pos="l"] { top: calc(76px - var(--ps, 1) * 44px); left: auto; right: calc(32px + var(--ps, 1) * 32px + 4px); bottom: auto; transform: translateY(-50%); margin: 0; }
.cv-lbl.off { visibility: hidden; }
.cv-mlpop { z-index: 6; }
.cv-mlpop .maplibregl-popup-content { padding: 12px 12px 10px; border-radius: 14px; box-shadow: 0 8px 26px rgba(0,0,0,.35); }
.cv-mlpop .maplibregl-popup-close-button { font-size: 20px; padding: 0 8px; }
/* 메인 지도 위 사진 핀(위치는 스크립트가 매 프레임 옮긴다) */

  // '이름@주소': 주소를 온라인 검색해서 위치를 찾는다.

    const m = s.match(/^(.*?)@\s*(.+)$/);
    return m ? { name: m[1].trim(), addr: m[2].trim() } : null;
  }
  // 온라인 검색에 쓸 문구 (주소가 있으면 주소, 없으면 적은 이름 그대로)
  function geoQuery(raw) {
    const s = String(raw).trim();
    const a = splitAddr(s);
    return a ? a.addr : s;
  }

  // 비슷한 이름의 다른 장소를 섞지 않기 위한 규칙:
  // '올드트래포드역'은 별칭 '올드트래포드'(경기장)를 포함하지만 다른 장소이므로 자동으로 붙이지 않는다.
  const DISTINCT = ['역', '공항', '정류장', '터미널', '호텔', '숙소', '게스트하우스', '호스텔', '박물관', '미술관', '공원', '광장', '궁전', '성당', '대성당', '시장', '마켓', '다리', '브리지', '타워', '센터', '항구', '선착장', '정션', '출구', '입구', '주차장', 'station', 'airport', 'hotel', 'museum', 'park', 'square', 'bridge', 'market'];
  const SINGLE = ['궁', '몰']; // 한 글자는 끝에 붙을 때만 다른 장소로 본다
  const SAME = ['경기장', '스타디움', '구장', 'stadium', '시내', '중심가', '중심', '근처', '인근', '부근', '주변', '일대', '근교', '앞', 'city', 'downtown'];
  const DISTINCT_N = DISTINCT.map(norm), SAME_N = SAME.map(norm);
  function sameEntity(n, alias) {
    let rem = n.replace(alias, '');
    SAME_N.slice().sort((x, y) => y.length - x.length).forEach((w) => { rem = rem.split(w).join(''); });
    if (!rem) return true;
    if (DISTINCT_N.some((w) => (w.length > 1 ? rem.startsWith(w) || rem.endsWith(w) : rem.endsWith(w)) && !alias.includes(w))) return false;
    if (SINGLE.some((w) => rem.endsWith(norm(w)) && !alias.includes(norm(w)))) return false;
    return true;
  }

  const ANCHOR_MAX_KM = 150; // 캐시된 온라인 검색 결과가 그 일차의 도시에서 이 거리보다 멀면 동명이지로 보고 무시한다

  // 일차 옆 메모에서 그날의 도시를 뽑는다: '1/16(토) 리버풀, 안필드 경기' → '리버풀'
  // 날짜·요일은 빼고, '리버풀 → 런던'처럼 여러 도시를 오가는 날은 한 도시로 한정하지 않는다('').
  function dayCity(label) {
    const s = String(label || '')
      .replace(/\([^)]*\)/g, ' ')
      .replace(/(?:\d{1,4}\s*[/.\-년월]\s*){1,2}\d{1,2}\s*일?/g, ' ')
      .replace(/[~～]/g, ' ');
    if (/→|->|⇒|➡|>/.test(s)) return '';
    const first = (s.split(/[,/·、+]/)[0] || '').trim();
    return /[가-힣a-zA-Z]/.test(first) ? first : '';
  }

  function lookup(raw, opts) {
    const s = String(raw).trim();
    if (!s) return null;
    // 주소: 이름@주소 (온라인 검색으로 찾은 결과가 있으면 사용)
    const ad = splitAddr(s);
    if (ad) {
      const g = GEO.get(norm(ad.addr));
      return g ? { name: ad.name || ad.addr, lat: g.lat, lng: g.lng, custom: true } : null;
    }
    const n = norm(s);
    if (!n) return null;
    // 1) 완전 일치
    for (const p of PLACES) if (p.aliases.includes(n)) return { name: s, lat: p.lat, lng: p.lng };
    const geoHit = (k) => {
      const g = GEO.get(k);
      return g && (GEO_TRUSTED.has(k) || !(opts && opts.anchor && haversine(g, opts.anchor) > ANCHOR_MAX_KM)) ? g : null;
    };
    // '리버풀 호텔 인근'처럼 이미 찾은 장소에 '인근' 등만 붙었으면 그 장소를 그대로 쓴다
    const suf = SAME_N.filter((w) => n.length > w.length && n.endsWith(w)).sort((x, y) => y.length - x.length)[0];
    const g = geoHit(n) || (suf ? geoHit(n.slice(0, -suf.length)) : null);
    if (g) return { name: s, lat: g.lat, lng: g.lng };
    // 2) 입력이 별칭을 포함 → 가장 긴 별칭 우선 (뒤에 붙은 말이 다른 종류의 장소면 제외)
    let best = null, bestLen = 0;
    for (const p of PLACES) for (const a of p.aliases) {
      if (a.length < 2 || (/^[a-z]+$/.test(a) && a.length < 5)) continue;
      if (n.includes(a) && a.length > bestLen && sameEntity(n, a)) { best = p; bestLen = a.length; }
    }
    if (best) return { name: s, lat: best.lat, lng: best.lng };
    // 3) 별칭이 입력을 포함 (입력이 3글자 이상, 후보가 하나뿐일 때만)
    if (n.length >= 3) {
      const hits = PLACES.filter((p) => p.aliases.some((a) => a.includes(n)));
      if (hits.length === 1) return { name: s, lat: hits[0].lat, lng: hits[0].lng };
    }
    return null;
  }

  // 호텔을 아직 못 정했을 때: 도시마다 '대충 이 근처'로 한 곳만 고정해서 쓴다(도시 중심 근처, 살짝 옮겨서 겹치지 않게).
  const HOTEL_CITY_ANCHORS = ['리버풀', '런던', '파리', '마드리드', '바르셀로나']
    .map((name) => lookup(name)).filter(Boolean);
  function hotelAnchorNear(pt) {
    if (!pt || !HOTEL_CITY_ANCHORS.length) return null;
    let best = HOTEL_CITY_ANCHORS[0], bestKm = haversine(pt, best);
    for (let i = 1; i < HOTEL_CITY_ANCHORS.length; i++) {
      const km = haversine(pt, HOTEL_CITY_ANCHORS[i]);
      if (km < bestKm) { best = HOTEL_CITY_ANCHORS[i]; bestKm = km; }
    }
    return best;
  }

  // ---------- 교통수단 ----------
  const MODES = {
    plane:  { ko: '비행기', emoji: '✈️', kw: ['비행기', '항공', '항공편', '비행', '플라이트', 'flight', 'plane', 'fly', '✈'] },
    train:  { ko: '기차',   emoji: '🚆', kw: ['기차', '열차', '고속열차', '고속철', '유로스타', 'ktx', 'ave', 'train', '철도', '🚆'] },
    subway: { ko: '지하철', emoji: '🚇', kw: ['지하철', '메트로', '튜브', 'subway', 'tube', 'metro', 'underground', '🚇'] },
    tram:   { ko: '트램',   emoji: '🚊', kw: ['트램', '전차', '메트로링크', 'tram', '🚊'] },
    bus:    { ko: '버스',   emoji: '🚌', kw: ['버스', 'bus', '🚌'] },
    walk:   { ko: '도보',   emoji: '🚶', kw: ['도보', '걸어서', '걷기', '걸어', '산책', 'walk', 'walking', '🚶'] },
    taxi:   { ko: '택시',   emoji: '🚕', kw: ['택시', '우버', '볼트', '렌터카', '자동차', '차', 'taxi', 'uber', 'car', '🚕'] },
    ship:   { ko: '배',     emoji: '⛴️', kw: ['배', '페리', '크루즈', '선박', 'ferry', 'ship', 'boat', '⛴'] },
  };
  const MODE_ORDER = ['plane', 'train', 'subway', 'tram', 'bus', 'walk', 'taxi', 'ship'];

  function modeExact(word) {
    const w = norm(word);
    if (!w || (w.length < 2 && /^[a-z가-힣]$/.test(w))) return null;
    for (const id of MODE_ORDER) for (const k of MODES[id].kw) { if (norm(k) === w) return id; }
    return null;
  }
  function detectMode(word) {
    const w = norm(word);
    if (!w) return null;
    for (const id of MODE_ORDER) {
      for (const k of MODES[id].kw) { if (norm(k) === w) return id; }
    }
    let best = null, bestLen = 0;
    for (const id of MODE_ORDER) {
      for (const k of MODES[id].kw) {
        const kk = norm(k);
        if (kk.length >= 2 && w.includes(kk) && kk.length > bestLen) { best = id; bestLen = kk.length; }
      }
    }
    if (best) return best;
    return null;
  }

  function guessMode(km) {
    if (km > 1200) return 'plane';
    if (km > 120) return 'train';
    if (km > 2.5) return 'subway';
    return 'walk';
  }

  // ---------- 계획 파싱 (이벤트 목록) ----------
  const ARROW = /\s*(?:->|=>|→|➜|>|⇒)\s*/;
  const ARROW_TEST = /(?:->|=>|→|➜|>|⇒)/;
  // 시간 한 덩어리: 10:30 / 10시 / 10시 30분 / 3시 반 / 오후 3시 (숫자만 있는 건 장소 이름과 헷갈려서 제외)
  const TOK = '(?:(오전|오후|am|pm)\\s*)?(\\d{1,2})\\s*(?::\\s*(\\d{2})|시\\s*(?:(\\d{1,2})\\s*분?|(반))?)';
  const TIME_RE = new RegExp('^' + TOK + '(?:\\s*[~\\-–—]\\s*' + TOK + ')?\\s*(.*)$', 'i');
  const pad = (h, m) => String(h).padStart(2, '0') + ':' + m;
  function tokTime(mer, h, m1, m2, half, inherit) {
    let hh = parseInt(h, 10);
    const mm = m1 !== undefined ? m1 : half ? '30' : m2 !== undefined ? m2 : '00';
    const w = (mer || inherit || '').toLowerCase();
    if ((w === '오후' || w === 'pm') && hh < 12) hh += 12;
    else if ((w === '오전' || w === 'am') && hh === 12) hh = 0;
    if (hh > 24 || parseInt(mm, 10) > 59) return null;
    return pad(hh, String(parseInt(mm, 10)).padStart(2, '0'));
  }
  // 전각 문자(＞ ： ～ 등)와 앞머리 글머리표(- * •)를 정리
  const tidy = (l) => l.replace(/[！-～]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/[〜∼]/g, '~').replace(/^[-*•·]\s+/, '');

  function parsePlan(text) {
    const events = [];
    const errors = [];
    const warnings = [];
    const missing = new Set();
    const missingDay = new Map(); // 못 찾은 장소 이름 → 처음 나온 일차 (같은 이름의 다른 도시 장소와 헷갈리지 않게 그 일차 도시 근처로 검색하기 위함)
    const days = {};
    let day = 0;
    const lines = String(text).split(/\r?\n/);
    // 일차 옆에 적은 도시(예: '2일차 런던, 소호')로 앵커를 잡아, 캐시에 남은 동명이지 결과를 걸러낸다.
    const dayAnchorCache = new Map();
    function dayAnchor(d) {
      if (dayAnchorCache.has(d)) return dayAnchorCache.get(d);
      const city = dayCity((days[d] && days[d].label) || '');
      const a = city ? lookup(city) : null;
      dayAnchorCache.set(d, a || null);
      return a || null;
    }
    // 지금까지 확정된 마지막 위치(직전 줄의 도착지). '호텔' 자리표시자의 좌표로도 쓴다.
    function lastPoint() {
      for (let k = events.length - 1; k >= 0; k--) {
        const e = events[k];
        return e.kind === 'move' ? e.leg.to : e.place;
      }
      return null;
    }
    // 호텔을 아직 못 정했을 때 '호텔'이라고만 적어 두면, 그 도시 중심 근처 한 곳으로 고정해서 '호텔 (미정)'으로 표시한다.
    // (도시 안에서 어느 장소 다음에 나오든 항상 같은 좌표를 쓴다 — 도시마다 하나로만 잡기 위함)
    const HOTEL_N = norm('호텔');
    function resolveTok(raw, day) {
      if (norm(raw) === HOTEL_N) {
        const near = lastPoint() || dayAnchor(day);
        const anchor = hotelAnchorNear(near) || near;
        if (!anchor) return null;
        return { name: '호텔 (미정)', lat: anchor.lat + 0.006, lng: anchor.lng + 0.006, hotelTBD: true };
      }
      return lookup(raw, { anchor: dayAnchor(day) });
    }

    lines.forEach((rawLine, idx) => {
      const line = tidy(rawLine.trim());
      if (!line || line.startsWith('#') || line.startsWith('//')) return;
      const ln = idx + 1;

      const dm = line.match(/^(?:day\s*(\d+)|(\d+)\s*일\s*차?)\s*[:：\-]?\s*(.*)$/i);
      if (dm) {
        day = parseInt(dm[1] || dm[2], 10);
        days[day] = { label: (dm[3] || '').trim() };
        return;
      }
      // 번호 없이 '다음날 제목'
      const nm = line.match(/^다음\s*날\s*[:\-]?\s*(.*)$/);
      if (nm) {
        day = (day || 1) + 1;
        days[day] = { label: (nm[1] || '').trim() };
        return;
      }

      // 시간
      let time = null, endTime = null, rest = line;
      const tm = line.match(TIME_RE);
      if (tm) {
        time = tokTime(tm[1], tm[2], tm[3], tm[4], tm[5]);
        if (tm[7] !== undefined) endTime = tokTime(tm[6], tm[7], tm[8], tm[9], tm[10], tm[1]);
        if (time) rest = tm[11].trim();
        else { time = null; endTime = null; }
      }
      // 메모 (' / ' 뒤)
      let memo = '';
      const mi = rest.search(/\s+\/\s+|\s+\/$/);
      if (mi >= 0) { memo = rest.slice(mi).replace(/^\s*\/\s*/, '').trim(); rest = rest.slice(0, mi).trim(); }
      if (!rest) { errors.push(`${ln}번째 줄: 장소나 이동을 적어 주세요.`); return; }
      if (!day) { day = 1; days[1] = days[1] || { label: '' }; }

      if (!ARROW_TEST.test(rest)) {
        // 장소 이벤트
        const pl = resolveTok(rest, day);
        if (!pl) { missing.add(rest); if (!missingDay.has(rest)) missingDay.set(rest, day); return; }
        events.push({ kind: 'place', day, time, endTime, memo, ln, place: pl });
        return;
      }

      // 이동 이벤트
      let modeWord = null, route = rest;
      let mm = rest.match(/^(.*?)\s*[:：|]\s*([^:：|>→]+?)\s*$/);
      if (mm) { route = mm[1]; modeWord = mm[2]; }
      else {
        mm = rest.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
        if (mm && detectMode(mm[2])) { route = mm[1]; modeWord = mm[2]; }
      }
      if (!modeWord) {
        // ':' 없이 끝에 교통수단만 붙여도 됨: '피카딜리역 > 올드 트래포드 트램', '... > 안필드 🚌'
        const em = route.match(/^(.*?)\s*(\p{Extended_Pictographic}\uFE0F?)$/u);
        const lm = route.match(/^(.*\S)\s+(\S+)$/);
        const cand = em && ARROW_TEST.test(em[1]) ? em : lm && ARROW_TEST.test(lm[1]) ? lm : null;
        if (cand && !/(?:->|=>|→|➜|>|⇒)\s*$/.test(cand[1]) && modeExact(cand[2].replace(/️/g, ''))) { route = cand[1]; modeWord = cand[2].replace(/️/g, ''); }
      }
      let mode = null;
      if (modeWord) {
        mode = detectMode(modeWord);
        if (!mode) { errors.push(`${ln}번째 줄: '${modeWord.trim()}'은(는) 알 수 없는 교통수단이에요.`); return; }
      }
      let parts = route.split(ARROW).map((p) => p.trim());
      const startsWithArrow = parts.length && parts[0] === '';
      if (startsWithArrow) parts = parts.slice(1);
      if (parts.length < 1 || (!startsWithArrow && parts.length < 2)) {
        errors.push(`${ln}번째 줄: '출발 > 도착 : 교통수단' 형식으로 적어 주세요.`); return;
      }
      const pts = [];
      let bad = false;
      if (startsWithArrow) {
        // 바로 앞 이벤트의 끝 위치에서 출발
        const prevEnd = lastPoint();
        if (!prevEnd) { errors.push(`${ln}번째 줄: 앞선 출발지가 없어요.`); return; }
        pts.push(prevEnd);
      }
      parts.forEach((p) => {
        const pl = resolveTok(p, day);
        if (!pl) { missing.add(p); if (!missingDay.has(p)) missingDay.set(p, day); bad = true; }
        else pts.push(pl);
      });
      if (bad) return;
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const km = haversine(a, b);
        if (km < 0.02) { warnings.push(`${ln}번째 줄: '${a.name}'과(와) '${b.name}'이(가) 같은 위치라 건너뛰었어요.`); continue; }
        let md = mode, guessed = false;
        if (!md) { md = guessMode(km); guessed = true; }
        events.push({
          kind: 'move', day, memo: i === 0 ? memo : '', ln,
          time: i === 0 ? time : null, endTime: i === pts.length - 2 ? endTime : null,
          leg: { from: a, to: b, mode: md, day, km, guessed },
        });
      }
    });

    // 위치 이어붙이기: 장소 이벤트에서 이동 경로(hop) 만들기, 어긋난 출발지 경고
    let prev = null;
    events.forEach((ev) => {
      if (ev.kind === 'move') {
        if (prev && haversine(prev, ev.leg.from) > 0.3) warnings.push(`${ev.ln}번째 줄: 출발지가 바로 앞 이벤트의 위치와 달라요.`);
        prev = ev.leg.to;
      } else {
        if (prev) {
          const km = haversine(prev, ev.place);
          if (km > 0.02) ev.leg = { from: prev, to: ev.place, mode: guessMode(km), day: ev.day, km, guessed: true, hop: true };
        }
        prev = ev.place;
      }
    });
    events.forEach((ev) => {
      if (!ev.leg) return;
      buildPath(ev.leg);
      if (ev.kind !== 'move') return;
      const l = ev.leg, M = MODES[l.mode].ko;
      if (l.mode === 'walk' && l.km > 8) warnings.push(`${ev.ln}번째 줄: ${l.from.name} → ${l.to.name}은(는) ${Math.round(l.km)}km라 도보로는 멀어요.`);
      if (l.mode === 'plane' && l.km < 150) warnings.push(`${ev.ln}번째 줄: ${l.from.name} → ${l.to.name}은(는) ${Math.round(l.km)}km라 ${M}으로는 가까워요.`);
      if (l.guessed) warnings.push(`${ev.ln}번째 줄: 교통수단이 없어 '${M}'(으)로 추정했어요.`);
    });
    const seen = new Set();
    const uniqWarn = warnings.filter((w) => (seen.has(w) ? false : (seen.add(w), true)));
    return { events, errors, warnings: uniqWarn, days, missing: [...missing], missingDay };
  }

  // ---------- 경로(곡선) ----------
  const BEND = { plane: 0.2, train: 0.09, subway: 0.09, tram: 0.09, bus: 0.09, walk: 0.06, taxi: 0.08, ship: 0.1 };

  function buildPath(leg) {
    const x1 = mx(leg.from.lng), y1 = my(leg.from.lat);
    const x2 = mx(leg.to.lng), y2 = my(leg.to.lat);
    const dx = x2 - x1, dy = y2 - y1;
    const d = Math.hypot(dx, dy) || 1e-9;
    const b = (BEND[leg.mode] || 0.08) * d;
    const cx = (x1 + x2) / 2 + (-dy / d) * b;
    const cy = (y1 + y2) / 2 + (dx / d) * b;
    const N = 56;
    const xs = new Float64Array(N + 1), ys = new Float64Array(N + 1), cum = new Float64Array(N + 1);
    let minx = 9, maxx = -9, miny = 9, maxy = -9;
    for (let i = 0; i <= N; i++) {
      const t = i / N, u = 1 - t;
      const x = u * u * x1 + 2 * u * t * cx + t * t * x2;

      ctx.fillStyle = visited ? theme.accent : theme.halo; ctx.fill();
      ctx.strokeStyle = theme.ink; ctx.lineWidth = 1.6; ctx.stroke();
    }
    drawLabels(Z, cur);

    // 캐릭터 (탈것)
    toScreen(cur.x, cur.y, Z); const sx = PX, sy = PY;
    if (cur.mode !== veh.mode) { veh.mode = cur.mode; veh.since = time; }
    const pt = Math.min(1, (time - veh.since) / 0.28);
    const pop = 0.55 + 0.45 * easeOutBack(pt);
    const hop = cur.hop ? -Math.abs(Math.sin(cur.hop * Math.PI)) * 9 * (1 - cur.hop) * S : 0;
    const cs = Math.cos(cur.heading);
    if (Math.abs(cs) > 0.15) veh.facing = cs >= 0 ? 1 : -1;
    drawVehicle({ mode: cur.mode, sx, sy: sy + hop, heading: cur.heading, facing: veh.facing, pop, moving: cur.moving }, time);
  }

  // ---------- 이벤트 도우미 ----------
  const key = (p) => `${p.lat.toFixed(4)},${p.lng.toFixed(4)}`; // 약 10m 단위로 같은 장소인지 판단
  const fmtKm = (km) => (km >= 100 ? Math.round(km).toLocaleString('ko-KR') : km >= 10 ? km.toFixed(0) : km.toFixed(1)) + 'km';
  const evTitle = (ev) => (ev.kind === 'move' ? `${ev.leg.from.name} → ${ev.leg.to.name}` : ev.place.name);
  const evIcon = (ev) => (ev.kind === 'move' ? L.MODES[ev.leg.mode].emoji : '📍');
  const evTime = (ev) => (ev.time ? (ev.endTime ? `${ev.time}~${ev.endTime}` : ev.time) : '');

  function buildNodes() {
    const map = new Map();
    const touch = (p, day, idx) => {
      const k = key(p);
      let n = map.get(k);
      if (!n) { n = { key: k, name: p.name, x: L.mx(p.lng), y: L.my(p.lat), visitIdx: Infinity, days: new Set() }; map.set(k, n); }
      n.days.add(day);
      if (idx < n.visitIdx) n.visitIdx = idx;
    };
    events.forEach((ev, i) => {
      if (ev.kind === 'place') touch(ev.place, ev.day, i);
      if (ev.leg) { touch(ev.leg.from, ev.day, i - 1); touch(ev.leg.to, ev.day, i); }
    });
    nodes = [...map.values()];
  }

  // k번째 이벤트가 끝난 뒤 캐릭터의 위치
  function holdAfter(k) {
    if (k < 0) {
      const ev = events[0];
      if (ev.kind === 'move') { const q = L.pathAt(ev.leg, 0); return { x: q.x, y: q.y, heading: q.heading, mode: 'walk' }; }
      return { x: L.mx(ev.place.lng), y: L.my(ev.place.lat), heading: 0, mode: 'walk' };
    }
    const ev = events[k];
    if (ev.kind === 'move') { const q = L.pathAt(ev.leg, 1); return { x: q.x, y: q.y, heading: q.heading, mode: ev.leg.mode }; }
    const heading = ev.leg ? L.pathAt(ev.leg, 1).heading : 0;
    return { x: L.mx(ev.place.lng), y: L.my(ev.place.lat), heading, mode: 'walk' };
  }

  // ---------- 이동 제어 ----------
  const nowSec = () => performance.now() / 1000;
  const targetIdx = () => (ctl.anim ? ctl.anim.items[ctl.anim.items.length - 1].after : ctl.curIdx);

  function finishAnim() {
    const a = ctl.anim;
    if (!a) return;
    ctl.curIdx = a.items[a.items.length - 1].after;
    ctl.hold = holdAfter(ctl.curIdx);
    ctl.anim = null;
  }

  function go(j) {
    if (!events.length) return;
    j = Math.max(-1, Math.min(events.length - 1, j));
    clearTimeout(ctl.autoTimer);
    finishAnim();
    const cur = ctl.curIdx;
    // 건너뛰는 '이동'이 2개 이상일 때만 빠르게 지나감. (장소 박스를 누르면 '이동+도착'이 함께 재생되는데, 이건 평소 속도로 캐릭터를 따라가며 보여줌)
    const span = [];
    if (j > cur) { for (let e = cur + 1; e <= j; e++) span.push(e); }
    else if (j < cur) { for (let e = cur; e > j; e--) span.push(e); }
    const multi = span.filter((e) => events[e].leg).length > 1;
    const mk = (e, rev) => {
      const ev = events[e];
      let dur = ev.leg ? L.moveDuration(ev.leg) : 0.6;
      if (multi) dur = ev.leg ? Math.max(0.45, Math.min(1.3, dur * 0.3)) : 0.12;
      return { e, rev, leg: ev.leg || null, after: rev ? e - 1 : e, dur };
    };
    const items = [];
    if (j > cur) { for (let e = cur + 1; e <= j; e++) items.push(mk(e, false)); }
    else if (j < cur) { for (let e = cur; e > j; e--) items.push(mk(e, true)); }
    else if (j >= 0) { ctl.curIdx = j - 1; ctl.hold = holdAfter(j - 1); items.push(mk(j, false)); }
    if (!items.length) return;
    ctl.anim = { items, i: 0, t0: nowSec() };
    ctl.camBoost = multi ? 3 : 1;
    const day = events[Math.max(0, j)].day;
    if (day !== ctl.lastDay) { ctl.lastDay = day; showDayCard(day); }
    refreshHud();
  }

  function onSettled(now) {
    ctl.arrivedAt = now;
    refreshHud();
    if (ctl.autoOn) {
      if (ctl.curIdx < events.length - 1) ctl.autoTimer = setTimeout(() => go(ctl.curIdx + 1), 3400);
      else { ctl.autoOn = false; updateAutoBtn(); }
    }
  }

  function stepAnim(now) {
    while (ctl.anim) {
      const a = ctl.anim, it = a.items[a.i];
      if (now - a.t0 < it.dur) break;
      ctl.curIdx = it.after;
      ctl.hold = holdAfter(it.after);
      a.t0 += it.dur;
      a.i++;
      if (a.i >= a.items.length) { ctl.anim = null; onSettled(now); break; }
    }
  }

  function currentView(now) {
    const v = { x: 0, y: 0, heading: 0, mode: 'walk', moving: false, hop: 0, day: 1, fromKey: null, toKey: null, prog: new Array(events.length) };
    const a = ctl.anim;
    let it = null, p = 0;
    if (a) { it = a.items[a.i]; p = easeIO((now - a.t0) / it.dur); }
    for (let i = 0; i < events.length; i++) v.prog[i] = i <= ctl.curIdx ? 1 : 0;
    if (it && it.leg) {
      const q = L.pathAt(it.leg, it.rev ? 1 - p : p);
      v.x = q.x; v.y = q.y; v.heading = q.heading + (it.rev ? Math.PI : 0);
      v.mode = it.leg.mode; v.moving = true;
      v.prog[it.e] = it.rev ? 1 - p : p;
    } else {
      const h = ctl.hold || holdAfter(ctl.curIdx);
      v.x = h.x; v.y = h.y; v.heading = h.heading; v.mode = h.mode;
      if (it) v.hop = Math.min(1, (now - a.t0) / it.dur);
      else { const s = (now - ctl.arrivedAt) / 0.6; v.hop = s >= 0 && s < 1 ? s : 0; }
    }
    const t = targetIdx();
    const fe = events[Math.max(0, t)];
    v.day = fe.day;
    if (fe.kind === 'move') { v.fromKey = key(fe.leg.from); v.toKey = key(fe.leg.to); }
    else v.toKey = key(fe.place);
    return v;
  }

  // ---------- HUD ----------
  let dayCardTimer = null;
  function showDayCard(day) {
    const info = state.plan && state.plan.days[day];
    $('#dcTitle').textContent = `${day}일차`;
    $('#dcSub').textContent = (info && info.label) || '';
    const c = $('#dayCard');
    c.classList.add('show');
    clearTimeout(dayCardTimer);
    dayCardTimer = setTimeout(() => c.classList.remove('show'), 1900);
  }

  function refreshHud() {
    if (!events.length) return;
    const t = targetIdx();
    // 캡션
    let cap;
    if (t < 0) cap = '아래 이벤트를 눌러 캐릭터를 이동시켜 보세요';
    else {
      const ev = events[t];
      const parts = [];
      if (ev.time) parts.push(evTime(ev));
      parts.push(ev.kind === 'move' ? `${evIcon(ev)} ${L.MODES[ev.leg.mode].ko} · ${evTitle(ev)} · ${fmtKm(ev.leg.km)}` : `📍 ${evTitle(ev)}`);
      cap = parts.join('  ');
      if (ev.memo) cap += ` — ${ev.memo}`;
    }
    $('#caption').textContent = cap;
    $('#legCount').textContent = `${Math.max(0, t + 1)}/${events.length}`;
    // 보고 있는 일차 따라가기
    if (t >= 0 && events[t].day !== state.viewDay) {
      // 전날 밤부터 머무는 장소 박스를 눌러 이동한 경우에는 보던 일차를 유지
      const keep = stopData && stopData.stops.some((st) => st.days.has(state.viewDay) && st.first <= t && t <= st.last);
      if (!keep) { state.viewDay = events[t].day; buildCards(); updateTitle(); }
    }
    document.querySelectorAll('#days .chip').forEach((c) => c.setAttribute('aria-current', String(Number(c.dataset.day) === state.viewDay)));
    let cur = null;
    const moving = !!ctl.anim; // 이동 중이면 도착 칸이 아니라 이동 표시가 '지금'
    document.querySelectorAll('#events .ev, #events .lk').forEach((b) => {
      const isStop = b.classList.contains('ev');
      const first = Number(b.dataset.first), end = Number(b.dataset.idx);
      const now = isStop ? first <= t && t <= end && !(moving && t === first && first >= 0) : moving && end === t;
      b.setAttribute('aria-current', String(now));
      b.classList.toggle('done', !now && (isStop ? end < t : end <= t));
      if (now) cur = b;
    });
    if (cur) { const box = cur.parentElement; box.scrollTo({ left: cur.offsetLeft - (box.clientWidth - cur.offsetWidth) / 2, behavior: reduceMotion ? 'auto' : 'smooth' }); }
    document.querySelectorAll('#legList .leg').forEach((b) => b.classList.toggle('now', Number(b.dataset.idx) === t));
  }

  function makeEventLabel(ev, withTime) {
    const t = evTime(ev);
    return (withTime && t ? `${t}  ` : '') + `${evIcon(ev)} ${evTitle(ev)}`;
  }

  function buildDays() {
    const box = $('#days'); box.textContent = '';
    [...new Set(events.map((e) => e.day))].forEach((d) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.dataset.day = d; b.textContent = `${d}일`;
      b.addEventListener('click', () => { state.viewDay = d; buildCards(); updateTitle(); refreshHud(); });
      box.appendChild(b);
    });
  }
  // ---------- 아래 박스: 장소마다 한 칸, 장소 사이에는 이동 시간 ----------
  const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null; };
  const fmtMin = (m) => (m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간${m % 60 ? ' ' + (m % 60) + '분' : ''}`);
  let stopData = null;

  // events → 장소(stop) 목록. stop.first~last: 이 장소에 도착해서 머무는 이벤트 번호 범위(-1은 출발 전)
  function buildStops() {
    const stops = [], linkAfter = [];
    let last = null;
    const add = (p, idx, day, arr) => {
      last = { place: p, name: p.name, key: key(p), first: idx, last: idx, arr, arrDay: day, dep: null, depDay: null, visit: '', visitEnd: '', memo: '', days: new Set([day]) };
      stops.push(last); linkAfter.push(null);
      return last;
    };
    events.forEach((ev, i) => {
      if (ev.leg) {
        if (!last || last.key !== key(ev.leg.from)) add(ev.leg.from, i - 1, ev.day, null);
        const from = last;
        from.days.add(ev.day);
        const isMove = ev.kind === 'move';
        if (isMove) { from.dep = ev.time || null; from.depDay = ev.day; }
        const to = ev.kind === 'place' ? ev.place : ev.leg.to;
        const st = add(to, i, ev.day, isMove ? ev.endTime || null : null);
        if (!isMove) { st.visit = ev.time || ''; st.visitEnd = ev.endTime || ''; st.memo = ev.memo || ''; }
        linkAfter[stops.length - 2] = { evIdx: i, leg: ev.leg, day: ev.day, time: isMove ? ev.time : null, endTime: isMove ? ev.endTime : null, hop: !isMove, memo: isMove ? ev.memo : '' };
      } else if (last && last.key === key(ev.place)) {
        last.last = i; last.days.add(ev.day);
        if (ev.time) { last.visit = ev.time; last.visitEnd = ev.endTime || ''; }
        if (ev.memo) last.memo = ev.memo;
      } else {
        const st = add(ev.place, i, ev.day, null);
        st.visit = ev.time || ''; st.visitEnd = ev.endTime || ''; st.memo = ev.memo || '';
      }
    });
    // 머무는 시간: (다음 이동 출발 시각 또는 방문 끝 시각) - (도착 시각 또는 방문 시각)
    stops.forEach((st) => {
      const a = toMin(st.arr) ?? toMin(st.visit);
      const d = toMin(st.dep) ?? toMin(st.visitEnd);
      st.stayMin = null;
      if (a === null || d === null) return;
      const dayGap = st.depDay !== null ? Math.max(0, st.depDay - st.arrDay) : 0;
      let m = dayGap * 1440 + d - a;
      let over = dayGap > 0;
      if (m < 0 && dayGap === 0) { m += 1440; over = true; } // 자정을 넘긴 경우
      if (m > 0) { st.stayMin = m; st.overnight = over || a + m >= 1440; }
    });
    stopData = { src: events, stops, linkAfter };
  }

  function linkText(lk) {
    const M = L.MODES[lk.leg.mode];
    const a = toMin(lk.time), b = toMin(lk.endTime);
    let m = null;
    if (a !== null && b !== null) { m = b - a; if (m < 0) m += 1440; }
    const bits = [];
    if (m) bits.push(fmtMin(m));
    bits.push(fmtKm(lk.leg.km));
    return { top: `${M.emoji} ${M.ko} →`, bottom: bits.join(' · ') };
  }

  function buildCards() {
    const box = $('#events'); box.textContent = '';
    if (!stopData || stopData.src !== events) buildStops();
    const { stops, linkAfter } = stopData;
    const d = state.viewDay;
    let prevShown = -1, lastK = -1;
    stops.forEach((st, k) => { if (st.days.has(d)) lastK = k; });
    stops.forEach((st, k) => {
      if (!st.days.has(d)) return;
      const lk = prevShown === k - 1 && k > 0 ? linkAfter[k - 1] : null;
      if (lk && lk.day === d) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'lk'; b.dataset.idx = lk.evIdx;
        const tx = linkText(lk);
        const m = document.createElement('span'); m.className = 'm'; m.textContent = tx.top;
        const kk = document.createElement('span'); kk.textContent = tx.bottom;
        b.append(m, kk);
        if (lk.memo) b.title = lk.memo;
        b.addEventListener('click', () => go(lk.evIdx));
        box.appendChild(b);
      }
      prevShown = k;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ev'; b.dataset.first = st.first; b.dataset.last = st.last; b.dataset.idx = st.last;
      const t = document.createElement('span'); t.className = 't';
      t.textContent = st.visit ? (st.visitEnd ? `${st.visit}~${st.visitEnd}` : st.visit) : st.arr ? `${st.arr} 도착` : st.first < 0 || (events[st.first] && events[st.first].day !== d) ? '출발지' : '시간 미정';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = `📍 ${st.name}`;
      b.append(t, n);
      if (st.stayMin) { const s2 = document.createElement('span'); s2.className = 'd'; s2.textContent = `${k === lastK ? '🌙' : '⏱'} ${fmtMin(st.stayMin)}`; b.append(s2); }
      if (st.memo) b.title = st.memo;
      b.addEventListener('click', () => go(st.last));
      box.appendChild(b);
    });
    box.scrollLeft = 0;
  }
  function buildEventList() {
    const box = $('#legList'); box.textContent = '';
    let lastDay = null;
    events.forEach((ev, i) => {
      if (ev.day !== lastDay) {
        const h = document.createElement('h4');
        const lb = state.plan.days[ev.day] && state.plan.days[ev.day].label;
        h.textContent = `${ev.day}일차${lb ? ' · ' + lb : ''}`;
        box.appendChild(h); lastDay = ev.day;
      }
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'leg'; b.dataset.idx = i;
      b.textContent = makeEventLabel(ev, true);
      b.addEventListener('click', () => { go(i); if (window.innerWidth < 820) closeSheet(); });
      box.appendChild(b);
    });
  }
  function showMsgs(plan) {
    const box = $('#msgs'); box.textContent = '';
    const add = (cls, t) => { const p = document.createElement('p'); p.className = cls; p.textContent = t; box.appendChild(p); };
    plan.errors.forEach((m) => add('err', m));
    plan.warnings.forEach((m) => add('warn', m));
    if (!plan.errors.length && !plan.warnings.length && !plan.missing.length) add('ok', `${plan.events.length}개 이벤트를 읽었어요.`);
  }

  // ---------- 버튼 ----------
  $('#prev').addEventListener('click', () => go(targetIdx() - 1));
  $('#next').addEventListener('click', () => go(targetIdx() + 1));
  function updateAutoBtn() {
    const b = $('#auto');
    b.setAttribute('aria-pressed', String(ctl.autoOn));
    b.textContent = ctl.autoOn ? '멈춤' : '자동';
  }
  $('#auto').addEventListener('click', () => {
    ctl.autoOn = !ctl.autoOn;
    updateAutoBtn();
    if (ctl.autoOn && !ctl.anim) {
      if (ctl.curIdx >= events.length - 1) { ctl.curIdx = -1; ctl.hold = holdAfter(-1); }
      go(ctl.curIdx + 1);
    } else if (!ctl.autoOn) clearTimeout(ctl.autoTimer);
  });
  window.addEventListener('keydown', (e) => {
    if (e.target && /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') go(targetIdx() + 1);
    else if (e.key === 'ArrowLeft') go(targetIdx() - 1);
  });

  // ---------- 장소 온라인 검색 (사전에 없는 장소) ----------
  const GEO_KEY = 'tripmap:geo1';
  const GEO_TRUSTED_KEY = 'tripmap:geoTrusted1';
  const GEOFAIL_KEY = 'tripmap:geoFail1'; // 못 찾은 이름 → 확인한 시각. 며칠간은 같은 이름을 다시 검색하지 않는다
  const GEOFAIL_TTL = 3 * 24 * 3600 * 1000;
  const TR_KEY = 'tripmap:tr1';           // 한글 → 영어 번역 결과
  const geoFail = new Set();
  const geoFailAt = new Map();
  let geoNetErr = 0; // 네트워크 오류 횟수: 오류로 실패한 걸 '없는 장소'로 저장하지 않으려고 센다
  let geoRun = 0;
  try { Object.entries(JSON.parse(store.get(GEO_KEY) || '{}')).forEach(([k, v]) => L.GEO.set(k, v)); } catch (e) { /* 캐시 무시 */ }
  try { JSON.parse(store.get(GEO_TRUSTED_KEY) || '[]').forEach((k) => L.GEO_TRUSTED.add(k)); } catch (e) { /* 캐시 무시 */ }
  try {
    const now = Date.now();
    Object.entries(JSON.parse(store.get(GEOFAIL_KEY) || '{}')).forEach(([k, t]) => { if (now - t < GEOFAIL_TTL) { geoFail.add(k); geoFailAt.set(k, t); } });
  } catch (e) { /* 캐시 무시 */ }
  const trCache = (() => { try { return JSON.parse(store.get(TR_KEY) || '{}') || {}; } catch (e) { return {}; } })();
  function saveGeo() { store.set(GEO_KEY, JSON.stringify(Object.fromEntries(L.GEO))); }
  function saveGeoFail() { store.set(GEOFAIL_KEY, JSON.stringify(Object.fromEntries(geoFailAt))); }
  function forgetGeoFail(name) { if (geoFail.delete(name) && geoFailAt.delete(name)) saveGeoFail(); }
  function saveGeoTrusted() { store.set(GEO_TRUSTED_KEY, JSON.stringify([...L.GEO_TRUSTED])); }

  // 검색 결과 중 동네/도시 등 '장소'로 태그된 것을 다른 종류(카페, 상점 등)보다 우선한다
  const PLACE_TYPES = new Set(['suburb', 'neighbourhood', 'quarter', 'city_district', 'borough', 'city', 'town', 'village', 'municipality', 'county', 'state', 'place', 'hamlet']);

  async function geocode(name, near, bounded) {
    // 이미 찾은 장소들 주변을 우선 검색 (앵커 도시가 있으면 bounded=1로 그 근처로 한정)
    const limit = bounded ? 10 : 1;
    let url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=${limit}&accept-language=ko&q=${encodeURIComponent(name)}`;
    if (near) url += `&viewbox=${near.w},${near.n},${near.e},${near.s}${bounded ? '&bounded=1' : ''}`;
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 10000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) { geoNetErr++; return null; }
      const j = await res.json();
      if (!j.length) return null;
      const best = (bounded && j.find((x) => PLACE_TYPES.has(x.addresstype))) || j[0];
      return { lat: parseFloat(best.lat), lng: parseFloat(best.lon) };
    } catch (e) { geoNetErr++; return null; } finally { clearTimeout(to); }
  }

  // 일차 옆에 적은 도시(예: '2일차 런던, 소호')를 기준으로 그 근처만 검색해서
  // 이름이 같은 다른 나라/도시 장소로 잘못 찾는 걸 막는다.
  const ANCHOR_PAD = 0.6; // 도시 중심에서 약 60km: 공항 등 도심 밖 장소도 포함하면서 동명이지와는 안 섞이게
  function anchorBox(a) { return { n: a.lat + ANCHOR_PAD, s: a.lat - ANCHOR_PAD, w: a.lng - ANCHOR_PAD, e: a.lng + ANCHOR_PAD }; }
  function dayCity(day, plan) {
    return L.dayCity((plan.days[day] && plan.days[day].label) || '');
  }

  // 한글 이름은 지도(OSM)에 등록 안 돼 있는 경우가 많아서, 검색이 실패하면
  // 영어로 번역해서 한 번 더 찾아본다.
  const hasHangul = (s) => /[가-힣]/.test(s);
  async function translateToEn(text) {
    if (trCache[text]) return trCache[text];
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 8000);
    try {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|en`;
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) { geoNetErr++; return null; }
      const j = await res.json();
      const t = j && j.responseData && j.responseData.translatedText;
      if (!t || /no query|mymemory warning/i.test(t)) return null;
      trCache[text] = t; store.set(TR_KEY, JSON.stringify(trCache));
      return t;
    } catch (e) { geoNetErr++; return null; } finally { clearTimeout(to); }
  }

  async function resolveMissing(text, names, plan) {
    const run = ++geoRun;
    const pts = plan.events.map((e) => e.place || (e.leg && e.leg.to)).filter(Boolean);
    let near = null;
    if (pts.length) {
      const lats = pts.map((p) => p.lat), lngs = pts.map((p) => p.lng);
      near = { n: Math.max(...lats) + 3, s: Math.min(...lats) - 3, w: Math.min(...lngs) - 3, e: Math.max(...lngs) + 3 };
    }
    const box = $('#msgs');
    let found = 0;
    let needWait = false;
    const wait = async () => { if (needWait) await new Promise((res) => setTimeout(res, 1100)); needWait = true; }; // Nominatim 이용 규칙: 초당 1회
    const dayAnchor = new Map(); // day -> {lat,lng} | null
    async function anchorFor(day) {
      if (dayAnchor.has(day)) return dayAnchor.get(day);
      const city = dayCity(day, plan);
      let a = city ? L.lookup(city) : null;
      if (city && !a) { await wait(); a = await geocode(city, near); if (a) { L.GEO.set(L.norm(city), a); saveGeo(); } }
      if (city && !a && hasHangul(city)) {
        await wait(); const en = await translateToEn(city);
        if (en) { await wait(); a = await geocode(en, near); if (a) { L.GEO.set(L.norm(city), a); saveGeo(); } }
      }
      dayAnchor.set(day, a || null);
      return a || null;
    }
    // 이미 실패로 확인된 이름(며칠 이내)도 '검색 중' 표시는 그대로 보여주되, 네트워크 요청만 건너뛴다
    for (let i = 0; i < names.length; i++) {
      if (run !== geoRun) return;
      const p = document.createElement('p'); p.className = 'ok';
      p.textContent = `장소 검색 중… (${i + 1}/${names.length}) ${L.geoQuery(names[i])}`;
      box.appendChild(p);
      if (geoFail.has(names[i])) continue;
      const q = L.geoQuery(names[i]);
      const errBefore = geoNetErr;
      const day = plan.missingDay && plan.missingDay.get(names[i]);
      const anchor = day ? await anchorFor(day) : null;
      // 그날 도시에서 너무 먼 결과는 다음 적용 때 동명이지로 걸러져 매번 다시 검색하게 되므로, 못 찾은 것으로 본다
      const inRange = (x) => (x && anchor && L.haversine(x, anchor) > L.ANCHOR_MAX_KM ? null : x);
      let r = null;
      if (anchor) { await wait(); r = await geocode(q, anchorBox(anchor), true); }
      if (!r) { await wait(); r = inRange(await geocode(q, near)); }
      let en = null;
      if (!r && hasHangul(q)) { await wait(); en = await translateToEn(q); }
      if (!r && en && L.norm(en) !== L.norm(q)) {
        const p2 = document.createElement('p'); p2.className = 'ok';
        p2.textContent = `영어로 번역해서 재검색 중… "${q}" → "${en}"`;
        box.appendChild(p2);
        if (anchor) { await wait(); r = await geocode(en, anchorBox(anchor), true); }
        if (!r) { await wait(); r = inRange(await geocode(en, near)); }
      }
      if (r) { L.GEO.set(L.norm(q), r); found++; saveGeo(); forgetGeoFail(names[i]); } // 하나 찾을 때마다 저장: 도중에 창을 닫아도 다음엔 다시 안 찾음
      else {
        geoFail.add(names[i]);
        // 네트워크 오류 없이 '결과 없음'이었던 것만 기억해서 다음 적용 때 건너뛴다
        if (geoNetErr === errBefore) { geoFailAt.set(names[i], Date.now()); saveGeoFail(); }
      }
    }
    if (run !== geoRun) return;
    if ($('#planText').value !== text) return; // 그 사이 다른 텍스트로 바뀌었으면 여기서 그만
    // 이번 검색 물결이 끝났으니(성공이든 실패든) 여기서 한 번만 재생을 시작한다
    const finalPlan = found ? L.parsePlan(text) : plan;
    showMsgs(finalPlan);
    if (finalPlan.events.length) buildFromPlan(finalPlan, text);
    const stillFailed = finalPlan.missing.filter((n) => geoFail.has(n));
    if (stillFailed.length) renderFixRows(stillFailed, text, finalPlan);
  }

  // 검색으로도 못 찾은 장소: 웹 안에서 바로 다시 검색해서 후보 목록 중에 골라 확정한다.
  // Photon(오타·부분 이름에 강함)과 Nominatim을 함께 쓰고, 한글은 영어 번역으로도 찾아본다.
  let nomiLast = 0;
  async function nomiSlot() { // Nominatim 이용 규칙: 초당 1회
    const w = nomiLast + 1100 - Date.now();
    nomiLast = Math.max(Date.now(), nomiLast + 1100);
    if (w > 0) await new Promise((res) => setTimeout(res, w));
  }
  async function fetchJson(url) {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 10000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      return res.ok ? await res.json() : null;
    } catch (e) { return null; } finally { clearTimeout(to); }
  }
  async function photonSearch(q, bias) {
    let url = `https://photon.komoot.io/api/?limit=6&q=${encodeURIComponent(q)}`;
    if (bias) url += `&lat=${bias.lat}&lon=${bias.lng}`;
    const j = await fetchJson(url);
    if (!j || !j.features) return [];
    return j.features.map((f) => {
      const p = f.properties || {};
      const addr = [p.street && [p.street, p.housenumber].filter(Boolean).join(' '), p.district, p.city, p.state, p.country]
        .filter((x, i, a) => x && x !== p.name && a.indexOf(x) === i).join(', ');
      return { name: p.name || addr.split(',')[0] || q, addr, lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] };
    });
  }
  async function nominatimSearch(q, bias) {
    await nomiSlot();
    let url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=ko&q=${encodeURIComponent(q)}`;
    if (bias) url += `&viewbox=${bias.lng - 1},${bias.lat + 1},${bias.lng + 1},${bias.lat - 1}`;
    const j = await fetchJson(url);
    if (!j) return [];
    return j.map((x) => {
      const parts = (x.display_name || '').split(', ');
      return { name: x.name || parts[0] || q, addr: parts.slice(x.name ? 1 : 0).join(', '), lat: parseFloat(x.lat), lng: parseFloat(x.lon) };
    });
  }
  async function searchCandidates(q, bias) {
    // 각 검색 서비스가 돌려준 순서(=검색어와 잘 맞는 순)를 rank로 기억해 둔다
    const once = async (s) => (await Promise.all([photonSearch(s, bias), nominatimSearch(s, bias)]))
      .flatMap((l) => l.map((c, i) => Object.assign(c, { rank: i })));
    const queries = [q];
    let list = await once(q);
    if (hasHangul(q)) {
      const en = await translateToEn(q);
      if (en && L.norm(en) !== L.norm(q)) { queries.push(en); list = list.concat(await once(en)); }
    }
    const qs = queries.map(L.norm);
    const out = [];
    list.forEach((c) => {
      if (!isFinite(c.lat) || !isFinite(c.lng)) return;
      if (bias) c.km = L.haversine(bias, c);
      // 점수가 낮을수록 위로: 검색 순위 + 거리(로그라서 몇 km 차이보단 수백 km 차이가 크게 반영) - 이름 일치 보너스
      const n = L.norm(c.name);
      const nameBonus = qs.includes(n) ? 4 : qs.some((s) => n.includes(s) || s.includes(n)) ? 1.5 : 0;
      c.score = c.rank + (bias ? 2 * Math.log10(1 + c.km) : 0) - nameBonus;
      const dup = out.findIndex((o) => L.haversine(o, c) < 0.05); // 50m 안의 같은 곳은 점수 좋은 쪽 하나만
      if (dup < 0) out.push(c);
      else if (c.score < out[dup].score) out[dup] = c;
    });
    out.sort((a, b) => a.score - b.score);
    return out.slice(0, 8);
  }
  function planCenter(plan) {
    const pts = plan.events.map((e) => e.place || (e.leg && e.leg.to)).filter(Boolean);
    if (!pts.length) return null;
    return { lat: pts.reduce((s, p) => s + p.lat, 0) / pts.length, lng: pts.reduce((s, p) => s + p.lng, 0) / pts.length };
  }

  function renderFixRows(names, text, plan) {
    if ($('#planText').value !== text) return;
    const box = $('#msgs');
    names.forEach((raw) => {
      const wrap = document.createElement('div'); wrap.className = 'fixbox';
      const row = document.createElement('div'); row.className = 'fixrow';
      const label = document.createElement('span'); label.className = 'err';
      label.textContent = `'${raw}'의 위치를 찾지 못했어요. 아래에서 검색해 골라 주세요.`;
      const input = document.createElement('input'); input.type = 'search'; input.className = 'fixinput';
      input.value = L.geoQuery(raw);
      input.placeholder = '장소 이름·주소로 검색 (한글도 돼요)';
      input.setAttribute('aria-label', `'${raw}' 위치 검색`);
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'qb'; btn.textContent = '검색';
      const results = document.createElement('div'); results.className = 'fixresults';
      const day = plan.missingDay && plan.missingDay.get(raw);
      const city = day ? dayCity(day, plan) : '';
      const bias = (city && L.lookup(city)) || planCenter(plan);
      const pick = (c) => {
        const key = L.norm(L.geoQuery(raw));
        L.GEO.set(key, { lat: c.lat, lng: c.lng }); L.GEO_TRUSTED.add(key); saveGeo(); saveGeoTrusted(); forgetGeoFail(raw);
        if ($('#planText').value === text) applyPlan(text);
      };
      let seq = 0;
      const search = async () => {
        const q = input.value.trim();
        if (!q) return;
        const my = ++seq;
        btn.disabled = true;
        results.textContent = '';
        const note = document.createElement('p'); note.className = 'ok'; note.textContent = `'${q}' 검색 중…`;
        results.appendChild(note);
        const list = await searchCandidates(q, bias);
        if (my !== seq) return;
        btn.disabled = false;
        results.textContent = '';
        if (!list.length) {
          const p = document.createElement('p'); p.className = 'warn';
          p.textContent = '검색 결과가 없어요. 다른 이름(현지 이름, 근처 역·거리 이름, 도시 이름을 붙이기 등)으로 검색해 보세요.';
          results.appendChild(p);
          return;
        }
        list.forEach((c) => {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'cand';
          const n = document.createElement('strong'); n.textContent = c.name;
          const a = document.createElement('span');
          a.textContent = [c.addr, c.km != null ? `${city || '여행지'}에서 ${c.km < 10 ? c.km.toFixed(1) : Math.round(c.km)}km` : ''].filter(Boolean).join(' · ');
          b.append(n, a);
          b.addEventListener('click', () => pick(c));
          results.appendChild(b);
        });
      };
      btn.addEventListener('click', search);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); search(); } });
      row.append(label, input, btn);
      wrap.append(row, results);
      box.appendChild(wrap);
      search(); // 처음엔 적어 둔 이름 그대로 후보를 찾아 보여준다
    });
  }

  // ---------- 계획 적용 ----------
  // 지도/애니메이션을 실제로 만들어 재생하는 부분. 장소 검색이 끝난 뒤에만 호출한다.
  function buildFromPlan(plan, text) {
    clearTimeout(ctl.autoTimer);
    ctl.autoOn = false; updateAutoBtn();
    state.plan = plan; events = plan.events;
    buildNodes();
    ctl.curIdx = -1; ctl.anim = null; ctl.hold = holdAfter(-1); ctl.arrivedAt = -10;
    ctl.lastDay = events[0].day; state.viewDay = events[0].day;
    updateTitle();
    invalidateFits();
    veh.mode = null;
    camKey = null; steerCamera(camTarget()); syncCam();
    startRoads();
    buildDays(); buildCards(); buildEventList(); refreshHud();
    cityPlanChanged();
  }

  function applyPlan(text) {
    const plan = L.parsePlan(text);
    showMsgs(plan);
    if (plan.missing.length) {
      // 아직 못 찾은 장소가 있으면 검색부터 끝내고, 검색이 끝난 뒤에 재생한다(바로 재생하지 않음)
      resolveMissing(text, plan.missing, plan);
      return 'pending';
    }
    if (!plan.events.length) return false;
    buildFromPlan(plan, text);
    return true;
  }

  // ---------- 캐릭터 설정 ----------
  function renderHats() {
    const box = $('#hats'); box.textContent = '';
    HATS.forEach((c) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'hat'; b.style.background = c;
      b.setAttribute('aria-label', `모자 색 ${c}`); b.setAttribute('aria-pressed', String(c === char.hat));
      b.addEventListener('click', () => { char.hat = c; renderHats(); saveChar(); });
      box.appendChild(b);
    });
  }
  function saveChar() { store.set('tripmap:char', JSON.stringify(char)); }
  function updateTitle() {
    const info = state.plan && state.plan.days[state.viewDay];
    const label = info && info.label ? ` ${info.label}` : '';
    $('#title').textContent = `${state.viewDay}일차${label}`;
  }
  $('#charName').addEventListener('input', (e) => { char.name = e.target.value.slice(0, 12); updateTitle(); saveChar(); });

  // ---------- 시트 ----------
  function openSheet() { const s = $('#sheet'); s.classList.add('open'); s.removeAttribute('inert'); $('#planBtn').setAttribute('aria-expanded', 'true'); }
  function closeSheet() { const s = $('#sheet'); s.classList.remove('open'); s.setAttribute('inert', ''); $('#planBtn').setAttribute('aria-expanded', 'false'); }
  $('#planBtn').addEventListener('click', () => ($('#sheet').classList.contains('open') ? closeSheet() : openSheet()));
  $('#closeSheet').addEventListener('click', closeSheet);

  // ---------- 설정 묶음(좁은 화면에서 선택/검색/3D를 하나로 접어 보여줌) ----------
  const settingsBtn = $('#settingsBtn'), settingsMenu = $('#settingsMenu');
  function openSettings() { settingsMenu.hidden = false; settingsBtn.setAttribute('aria-expanded', 'true'); }
  function closeSettings() { settingsMenu.hidden = true; settingsBtn.setAttribute('aria-expanded', 'false'); }
  settingsBtn.addEventListener('click', () => (settingsMenu.hidden ? openSettings() : closeSettings()));
  settingsMenu.addEventListener('click', (e) => { if (e.target.closest('.pill-btn')) closeSettings(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !settingsMenu.hidden) closeSettings(); });
  document.addEventListener('pointerdown', (e) => {
    if (!settingsMenu.hidden && !settingsMenu.contains(e.target) && e.target !== settingsBtn) closeSettings();
  });

  // ---------- 장소 검색 (계획에 있는 장소를 검색해서 그 방문 시점으로 이동) ----------
  const searchBtn = $('#searchBtn'), searchPanel = $('#searchPanel'), searchInput = $('#searchInput'), searchResults = $('#searchResults');
  function stopWhenText(st) {
    if (st.visit) return st.visitEnd ? `${st.visit}~${st.visitEnd}` : st.visit;
    if (st.arr) return `${st.arr} 도착`;
    return st.first < 0 ? '출발지' : '시간 미정';
  }
  function renderSearchResults(query) {
    searchResults.textContent = '';
    if (!stopData || !stopData.stops.length) {
      const p = document.createElement('p'); p.id = 'searchEmpty'; p.textContent = '먼저 여행 계획을 적어 주세요.';
      searchResults.appendChild(p); return;
    }
    const q = L.norm(query);
    const matches = !q ? stopData.stops : stopData.stops.filter((st) => L.norm(st.name).includes(q));
    if (!matches.length) {
      const p = document.createElement('p'); p.id = 'searchEmpty'; p.textContent = `'${query.trim()}'에 해당하는 장소가 없어요.`;
      searchResults.appendChild(p); return;
    }
    matches.forEach((st) => {
      const b = document.createElement('button'); b.type = 'button';
      const n = document.createElement('span'); n.className = 'sr-name'; n.textContent = `📍 ${st.name}`;
      const w = document.createElement('span'); w.className = 'sr-when'; w.textContent = `${st.arrDay}일차 · ${stopWhenText(st)}`;
      b.append(n, w);
      b.addEventListener('click', () => { go(st.last); closeSearch(); });
      searchResults.appendChild(b);
    });
  }
  function openSearch() {
    if (!stopData || stopData.src !== events) buildStops();
    searchPanel.hidden = false;
    searchBtn.setAttribute('aria-expanded', 'true');
    renderSearchResults(searchInput.value);
    requestAnimationFrame(() => searchInput.focus());
  }
  function closeSearch() {
    searchPanel.hidden = true;
    searchBtn.setAttribute('aria-expanded', 'false');
  }
  searchBtn.addEventListener('click', () => { if (searchPanel.hidden) openSearch(); else closeSearch(); });
  $('#searchClose').addEventListener('click', closeSearch);
  searchInput.addEventListener('input', () => renderSearchResults(searchInput.value));
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { const first = searchResults.querySelector('button'); if (first) first.click(); }
    else if (e.key === 'Escape') closeSearch();
  });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !searchPanel.hidden) closeSearch(); });
  document.addEventListener('pointerdown', (e) => {
    if (!searchPanel.hidden && !searchPanel.contains(e.target) && e.target !== searchBtn) closeSearch();
  });

  // ---------- 장소 정보 (위키백과 요약 + 사진) ----------
  const WIKI_KEY = 'tripmap:wiki1';
  const wikiCache = (() => { try { return JSON.parse(store.get(WIKI_KEY) || '{}') || {}; } catch (e) { return {}; } })();
  function saveWiki() { store.set(WIKI_KEY, JSON.stringify(wikiCache)); }
  let wikiNetErr = 0; // 네트워크 오류로 못 받은 것을 '설명 없음'으로 저장하지 않으려고 센다
  async function wikiSearchTitle(lang, name) {
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=1&srsearch=${encodeURIComponent(name)}`;
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 8000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) { wikiNetErr++; return null; }
      const j = await res.json();
      const hit = j.query && j.query.search && j.query.search[0];
      return hit ? hit.title : null;
    } catch (e) { wikiNetErr++; return null; } finally { clearTimeout(to); }
  }
  async function wikiSummary(lang, title) {
    const url = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 8000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) { if (res.status !== 404) wikiNetErr++; return null; }
      const j = await res.json();
      if (j.type === 'disambiguation') return null;
      return {
        title: j.title, extract: j.extract || '',
        image: (j.thumbnail && j.thumbnail.source) || (j.originalimage && j.originalimage.source) || null,
        pageUrl: j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page,
      };
    } catch (e) { wikiNetErr++; return null; } finally { clearTimeout(to); }
  }
  async function fetchPlaceInfo(name) {
    const key = L.norm(name);
    if (Object.prototype.hasOwnProperty.call(wikiCache, key)) return wikiCache[key];
    const qn = L.norm(name);
    const errBefore = wikiNetErr;
    let info = null;
    for (const lang of ['ko', 'en']) {
      const title = await wikiSearchTitle(lang, name);
      if (!title) continue;
      // 검색어와 아예 상관없는 문서가 잡히는 걸 걸러냄(예: 역 이름 검색 → 엉뚱한 철도 문서)
      const tn = L.norm(title);
      const prefix = qn.slice(0, Math.min(2, qn.length));
      if (prefix && !tn.includes(prefix)) continue;
      info = await wikiSummary(lang, title);
      if (info) break;
    }

  function currentPlace() {

  // ---------- 실제 도로 경로 (OSRM 공개 서버) ----------
  // 도보=foot, 버스·택시·트램=car 프로필. 기차·지하철·비행기·배는 곡선 그대로.
  const ROAD = { walk: { prof: 'foot', maxKm: 15 }, bus: { prof: 'car', maxKm: 120 }, taxi: { prof: 'car', maxKm: 120 }, tram: { prof: 'car', maxKm: 40 } };
  const roadCache = (() => { try { return JSON.parse(store.get('tripmap:roads1') || '{}') || {}; } catch (e) { return {}; } })();

  function saveRoads() { clearTimeout(roadSaveT); roadSaveT = setTimeout(() => store.set('tripmap:roads1', JSON.stringify(roadCache)), 600); }
  const roadKey = (leg) => `${ROAD[leg.mode].prof}|${leg.from.lat.toFixed(5)},${leg.from.lng.toFixed(5)}|${leg.to.lat.toFixed(5)},${leg.to.lng.toFixed(5)}`;
  const r5 = (v) => Math.round(v * 1e5) / 1e5;

  // flat: [lat, lng, lat, lng, ...] → TripLogic.pathAt이 읽는 path 형식
  function pathFromFlat(flat) {
    const n = flat.length / 2, N = n - 1;
    const xs = new Float64Array(n), ys = new Float64Array(n), cum = new Float64Array(n);
    let minx = 9, maxx = -9, miny = 9, maxy = -9;
    for (let i = 0; i < n; i++) {
      const x = L.mx(flat[2 * i + 1]), y = L.my(flat[2 * i]);
      xs[i] = x; ys[i] = y;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
      if (i) cum[i] = cum[i - 1] + Math.hypot(x - xs[i - 1], y - ys[i - 1]);
    }
    return { xs, ys, cum, len: cum[N], N, minx, maxx, miny, maxy };
  }

  async function fetchRoad(leg) {
    const a = leg.from, b = leg.to;
    const url = `https://routing.openstreetmap.de/routed-${ROAD[leg.mode].prof}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 25000);
    try {
      let res = null;
      for (let t = 0; t < 4; t++) {
        res = await fetch(url, { signal: ctrl.signal });
        if (res.status !== 429 && res.status < 500) break;
        await new Promise((r) => setTimeout(r, 1500 * (t + 1)));
      }
      if (!res || !res.ok) return null;
      const j = await res.json();
      const g = j.routes && j.routes[0] && j.routes[0].geometry && j.routes[0].geometry.coordinates;
      if (!g || g.length < 2) return null;
      const step = Math.max(1, Math.ceil(g.length / 500));
      const pts = [[a.lat, a.lng]];
      for (let i = 0; i < g.length; i += step) pts.push([g[i][1], g[i][0]]);
      pts.push([g[g.length - 1][1], g[g.length - 1][0]], [b.lat, b.lng]);
      let km = 0;
      for (let i = 1; i < pts.length; i++) km += L.haversine({ lat: pts[i - 1][0], lng: pts[i - 1][1] }, { lat: pts[i][0], lng: pts[i][1] });
      if (km > leg.km * 6 + 1) return null;
      const flat = [];
      pts.forEach((p) => flat.push(r5(p[0]), r5(p[1])));
      return flat;
    } catch (e) { return null; } finally { clearTimeout(to); }
  }

  const follow = { leg: null, z: 0, t: 0 };
  function followVehicle(v, t) {
    const it = ctl.anim.items[ctl.anim.i];

      const cap = it.leg.mode === 'plane' ? 16.5 : 17.5;

  const isSight = (pl) => !KINDS[pl.kind].hidden;

  async function fetchNearbyPhoto(p) {
    const key = `geo:${p.lat.toFixed(4)},${p.lng.toFixed(4)}`;
    if (Object.prototype.hasOwnProperty.call(wikiCache, key)) return wikiCache[key];

  }
  async function getPlacePhoto(place) {

  const bigPhoto = (u) => (/upload\.wikimedia\.org\/.*\/thumb\//.test(u) ? u.replace(/\/\d{2,4}px-/, '/500px-') : u);
  // 사진을 받아 pl.photo에 넣는다(동시에 3개씩). 받을 때마다 onDone(pl) 호출
  async function ensurePhotos(places, onDone) {

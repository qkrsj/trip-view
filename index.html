  // ---------- 장소를 가까운 것끼리 묶어 도시 목록 만들기 ----------
  function buildCityData() {
    if (!stopData || stopData.src !== events) buildStops();
    const { stops } = stopData;
    const byKey = new Map();
    stops.forEach((st) => {
      let pl = byKey.get(st.key);
      if (!pl) { pl = { key: st.key, place: st.place, name: st.name, kind: placeKind(st.name), visits: [], num: 0, photo: undefined, info: undefined }; byKey.set(st.key, pl); }
      const v = { day: st.arrDay, when: stopWhenText(st), memo: st.memo || '' };
      if (!pl.visits.some((x) => x.day === v.day && x.when === v.when)) pl.visits.push(v);
    });
    const all = [...byKey.values()];
    const list = all.filter(isSight); // 공항·역·숙소·식당은 뺀다
    cv.hidden = all.length - list.length;
    cv.sightKeys = new Set(list.map((p) => p.key));
    const parent = list.map((_, i) => i);
    const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      if (L.haversine(list[i].place, list[j].place) <= CITY_LINK_KM) parent[find(j)] = find(i);
    }
    const groups = new Map();
    list.forEach((pl, i) => { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(pl); });
    cv.clusters = [...groups.values()].map((places, id) => {
      places.forEach((pl, i) => { pl.num = i + 1; });
      const center = { lat: places.reduce((a, p) => a + p.place.lat, 0) / places.length, lng: places.reduce((a, p) => a + p.place.lng, 0) / places.length };
      const c = { id, places, center, name: '', country: '', pending: true, byKey: new Map(places.map((p) => [p.key, p])) };
      // 일차 제목('4일차 런던 웨스트민스터', '출국, 맨체스터 도착')의 단어 중 사전에 있는 도시 이름이면서 이 묶음 안에 있는 것을 도시 이름 후보로 쓴다(많이 나온 순)
      const votes = new Map();
      places.forEach((pl) => pl.visits.forEach((v) => {
        const raw = String((state.plan.days[v.day] && state.plan.days[v.day].label) || '')
          .replace(/\([^)]*\)/g, ' ').replace(/(?:\d{1,4}\s*[/.\-년월]\s*){1,2}\d{1,2}\s*일?/g, ' ').replace(/[~～]/g, ' ');
        raw.split(/[,/·、+→>\s]+/).forEach((tk) => { if (/[가-힣A-Za-z]/.test(tk)) votes.set(tk, (votes.get(tk) || 0) + 1); });
      }));
      c.guess = [...votes.entries()].sort((a, b) => b[1] - a[1]).map((x) => x[0]).find((nm) => {
        if (!L.PLACES.some((q) => q.aliases.includes(L.norm(nm))) || placeKind(nm) !== 'landmark') return false; // 사전의 도시 이름 그대로일 때만
        const at = L.lookup(nm); return at && L.haversine(at, center) <= CITY_LINK_KM;
      }) || '';
      applyRev(c);
      return c;
    });
    cv.stops = stops;
    cv.dirty = false;
  }
  const revKey = (c) => `${c.center.lat.toFixed(2)},${c.center.lng.toFixed(2)}`;
  function applyRev(c) {
    const r = revCache[revKey(c)];
    if (r) { c.country = r.country || ''; c.pending = false; }
    const rc = ((r && r.city) || '').replace(/^그레이터\s*/, '');
    // 계획에 적은 도시 이름이 있으면 그걸 쓰고, 없으면 지도 서비스가 준 이름을 쓴다
    c.name = c.guess || (/[가-힣A-Za-z]/.test(rc) && rc) || `지역 ${c.id + 1}`;
  }
  // 도시·나라 이름은 좌표로 온라인 조회한다(Nominatim 규칙대로 천천히, 결과는 저장)
  async function nameCities(run) {
    for (const c of cv.clusters) {
      if (run !== cv.run) return;
      if (revCache[revKey(c)]) continue;
      await nomiSlot();
      const j = await fetchJson(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=ko&lat=${c.center.lat}&lon=${c.center.lng}`);
      if (run !== cv.run) return;
      const a = j && j.address;
      if (a) {
        revCache[revKey(c)] = { city: a.city || a.town || a.village || a.municipality || a.county || a.state_district || a.state || '', country: a.country || '' };
        store.set(REV_KEY, JSON.stringify(revCache));
      } else c.pending = false; // 못 알아냈으면 '확인 중'은 끝내고 나라만 비워 둔다
      applyRev(c);
      renderCityNav();
    }
  }

  // ---------- 위쪽 나라·도시 선택 ----------
  const visibleClusters = () => cv.clusters.filter((c) => !cv.country || c.country === cv.country);
  const cityTitle = (c) => `${c.name}${c.country ? ' · ' + c.country : ''} — 볼거리 ${c.places.length}곳`;
  function renderCityNav() {
    const countries = [...new Set(cv.clusters.map((c) => c.country))].filter(Boolean);
    const anyPending = cv.clusters.some((c) => c.pending);
    if (cv.country && !countries.includes(cv.country)) cv.country = '';
    cvCountry.textContent = '';
    const opt = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; cvCountry.appendChild(o); };
    opt('', countries.length > 1 || anyPending ? '전체 나라' : (countries[0] || '나라 미확인'));
    countries.forEach((n) => opt(n, `${n} (${cv.clusters.filter((c) => c.country === n).length})`));
    cvCountry.value = cv.country;
    cvCities.textContent = '';
    const vis = visibleClusters();
    const chip = (label, sub, on, fn) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'cv-chip'; b.setAttribute('aria-pressed', String(on));
      b.textContent = label;
      if (sub) { const s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
      b.addEventListener('click', fn); cvCities.appendChild(b);
    };
    if (vis.length > 1) chip('전체', `${vis.length}개 도시`, cv.city === null, () => selectCity(null));
    vis.forEach((c) => chip(c.name, `${c.places.length}곳`, cv.city === c.id, () => selectCity(c.id)));
    const sel = cv.city === null ? null : cv.clusters.find((c) => c.id === cv.city);
    if (sel && cv.title) cv.title.textContent = cityTitle(sel);
  }
  function selectCity(id) {
    cv.city = id;
    renderCityNav();
    renderCityMap();
  }

  // ---------- 핀·카드 그림: 실제 사진(없으면 종류 색 + 이모지) ----------
  function fillPhoto(box, name, photo, K) {
    box.textContent = '';
    box.style.background = photo ? '' : K.color;
    if (photo) {
      const img = document.createElement('img'); img.alt = name; img.decoding = 'async';
      img.addEventListener('error', () => fillPhoto(box, name, null, K));

  const placePin = (pl) => ({ color: dayColor(pl.visits[0].day), name: pl.name, K: KINDS[pl.kind], photo: pl.photo });
  const cityPin = (c) => ({ color: theme.accent, name: c.name, K: KINDS.landmark, photo: c.places[0].photo });
  // o: { color, name, K:{emoji,color}, photo }. 지도가 바깥 요소(.cv-mk)의 위치를 옮기므로 그림은 안쪽(.cv-pin)에 둔다. 핀 끝(아래 가운데)이 좌표
  function makePin(o, idx) {
    const el = document.createElement('div'); el.className = 'cv-mk';
    const pin = document.createElement('div'); pin.className = 'cv-pin';
    const body = document.createElement('div'); body.className = 'cv-pbody'; body.style.setProperty('--i', idx || 0); // 차례로 톡톡 나타나는 애니메이션
    const card = document.createElement('div'); card.className = 'cv-card'; card.style.borderColor = o.color;
    fillPhoto(card, o.name, o.photo, o.K);
    const tip = document.createElement('span'); tip.className = 'cv-tip'; tip.style.background = o.color; // 아래 뾰족한 끝이 실제 위치
    const sh = document.createElement('span'); sh.className = 'cv-shadow'; // 바닥 그림자
    body.append(sh, tip, card);
    const l = document.createElement('span'); l.className = 'cv-lbl'; l.textContent = o.name;
    pin.append(body, l); el.appendChild(pin);
    el.title = o.name;
    return el;
  }
  const updatePin = (el, o) => { const card = el.querySelector('.cv-card'); if (card) fillPhoto(card, o.name, o.photo, o.K); };

  // 핀 배율: 좁은 화면이거나 멀리서 볼수록 작게(핀 끝을 기준으로 줄어든다)
  const pinScale = () => (window.innerWidth <= 520 ? 0.8 : 1) * (cv.map && cv.map.getZoom() < 12.5 ? 0.7 : 1);
  // 이름표는 핀의 아래·위·오른쪽·왼쪽 중 다른 이름표·핀과 안 겹치는 자리에 놓는다(어디에도 못 놓으면 감춤, 가까이 확대하면 다 보임)
  const rectHit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  function declutter() {
    if (!cv.map) return;
    const s = pinScale(), pw = PIN * s, ph = PINH * s;
    const pts = cv.items.map((it) => { const m = cv.markers.get(it.key); return m && { m, p: cv.map.project(m.getLngLat()) }; }).filter(Boolean);
    const pinRects = pts.map(({ p }) => ({ x: p.x - pw / 2, y: p.y - ph, w: pw, h: ph })); // p = 핀 끝
    const placed = [];
    pts.forEach(({ m, p }, i) => {
      const lbl = m.getElement().querySelector('.cv-lbl');
      if (!lbl) return;
      const w = lbl.offsetWidth, h = lbl.offsetHeight, cy = p.y - (PINH - PIN / 2) * s; // 동그란 사진의 가운데 높이
      const spots = [
        ['b', { x: p.x - w / 2, y: p.y + 3, w, h }],
        ['t', { x: p.x - w / 2, y: p.y - ph - 3 - h, w, h }],
        ['r', { x: p.x + pw / 2 + 4, y: cy - h / 2, w, h }],
        ['l', { x: p.x - pw / 2 - 4 - w, y: cy - h / 2, w, h }],
      ];
      const ok = spots.find(([, r]) => !placed.some((q) => rectHit(q, r)) && !pinRects.some((q, j) => j !== i && rectHit(q, r)));
      lbl.classList.toggle('off', !ok);

  let declutterT = null;

  // ---------- 팝업: 큰 사진 + 설명 ----------
  function popupFor(pl) {

        });
        img.src = bigPhoto(info.image);
        photo.replaceWith(img);
      } else photo.textContent = '이 장소의 사진을 찾지 못했어요.';
      if (info && info.extract) txt.textContent = info.extract;
      if (info && info.pageUrl) {

    (pl.info !== undefined ? Promise.resolve(pl.info) : getPlacePhoto(pl.place)).then(show).catch(() => { photo.textContent = '이 장소의 사진을 찾지 못했어요.'; });
    return box;
  }
  function makePopup(pl) {
    const pop = new maplibregl.Popup({ offset: { top: [0, 6], 'top-left': [0, 6], 'top-right': [0, 6], bottom: [0, -72], 'bottom-left': [0, -72], 'bottom-right': [0, -72], left: [18, -38], right: [-18, -38] }, maxWidth: '290px', closeButton: true, focusAfterOpen: false, className: 'cv-mlpop' });

  // ---------- 지도 (MapLibre: 자세한 3D 건물 지도 + 카메라 이동 애니메이션) ----------
  const OFM_3D = 'https://tiles.openfreemap.org/styles/liberty'; // 3D 건물이 있는 지도(메인 지도의 3D 보기용)
  const RASTER_STYLE = { version: 8, sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19, attribution: OSM_ATTR } }, layers: [{ id: 'osm', type: 'raster', source: 'osm' }] };
  const EMPTY_FC = { type: 'FeatureCollection', features: [] };
  // 스타일 JSON을 지도에 넘기기 전에 지명을 영어로 바꾼다(지도를 만든 뒤 레이어마다 바꾸면 그때마다 타일을 다시 해석해서 아주 느려진다)
  function englishStyle(style) {
    style.layers.forEach((ly) => {
      const tf = ly.layout && ly.layout['text-field'];
      if (tf && JSON.stringify(tf).includes('name')) ly.layout['text-field'] = ENGLISH;
    });
    return style;
  }
  // ---------- 도시별 지도용 '게임 지도' 스타일 ----------
  // OpenFreeMap 벡터 타일(OpenMapTiles 구조)에 직접 만든 밝은 만화풍 색을 입힌다: 하늘색 물, 연두 공원, 크림색 땅, 하얀·노란 도로, 파스텔 건물, 굵고 큰 지명.
  // 작은 길 이름·철도·상점 아이콘은 넣지 않아서 내가 갈 장소만 눈에 띈다.
  const G = {
    land: '#fdf5df', res: '#fbeccd', grass: '#c9f0a5', park: '#a9e88f', wood: '#8fdc86', sand: '#fde9a6', water: '#7ed3ff', river: '#7ed3ff',
    school: '#ffe1ec', hospital: '#ffdada', special: '#ece0ff', building: '#ffd9c4', buildingEdge: '#f2b494',
    road: '#ffffff', roadEdge: '#ecdcb6', main: '#fff0a8', mainEdge: '#f1c95a', motor: '#ffcf7a', motorEdge: '#eb9d3d',
    ink: '#4a3f7a', halo: '#ffffff', waterInk: '#2f96d6',
  };
  function gameStyle() {
    const Zm = ['zoom'];
    const cls = (...c) => ['match', ['get', 'class'], c, true, false];
    const wide = (stops, add) => ['interpolate', ['exponential', 1.4], Zm, ...stops.flatMap(([z, w]) => [z, w + (add || 0)])];
    const notTunnel = ['!=', ['get', 'brunnel'], 'tunnel'];
    const src = 'openmaptiles';
    const road = (id, classes, minzoom, stops, fill, edge) => [
      { id: id + '-edge', type: 'line', source: src, 'source-layer': 'transportation', minzoom, filter: ['all', cls(...classes), notTunnel], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': edge, 'line-width': wide(stops, 2.6) } },
      { id: id + '-fill', type: 'line', source: src, 'source-layer': 'transportation', minzoom, filter: ['all', cls(...classes), notTunnel], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': fill, 'line-width': wide(stops) } },
    ];
    const label = (id, layer, filter, minzoom, size, extra) => ({
      id, type: 'symbol', source: src, 'source-layer': layer, minzoom, filter,
      layout: Object.assign({ 'text-field': ENGLISH, 'text-font': ['Noto Sans Bold'], 'text-size': size, 'text-max-width': 7, 'text-padding': 3 }, (extra && extra.layout) || {}),
      paint: Object.assign({ 'text-color': G.ink, 'text-halo-color': G.halo, 'text-halo-width': 2.4, 'text-halo-blur': 0.4 }, (extra && extra.paint) || {}),
    });
    const fillL = (id, layer, filter, color, extra) => Object.assign({ id, type: 'fill', source: src, 'source-layer': layer, paint: { 'fill-color': color } }, filter ? { filter } : {}, extra || {});
    const layers = [
      { id: 'bg', type: 'background', paint: { 'background-color': G.land } },
      fillL('landuse-res', 'landuse', cls('residential', 'suburb', 'neighbourhood', 'commercial', 'retail'), G.res, { minzoom: 9 }),
      fillL('landcover-sand', 'landcover', cls('sand'), G.sand),
      fillL('landcover-grass', 'landcover', cls('grass', 'farmland', 'wetland'), G.grass),
      fillL('landcover-wood', 'landcover', cls('wood', 'forest'), G.wood),
      fillL('park', 'park', null, G.park),
      fillL('landuse-green', 'landuse', cls('pitch', 'garden', 'playground', 'cemetery', 'stadium'), G.park, { minzoom: 11 }),
      fillL('landuse-school', 'landuse', cls('school', 'university', 'kindergarten', 'college'), G.school, { minzoom: 12 }),
      fillL('landuse-hospital', 'landuse', cls('hospital'), G.hospital, { minzoom: 12 }),
      fillL('aeroway', 'aeroway', ['==', ['geometry-type'], 'Polygon'], G.special, { minzoom: 9 }),
      fillL('water', 'water', null, G.water),
      { id: 'waterway', type: 'line', source: src, 'source-layer': 'waterway', minzoom: 8, layout: { 'line-cap': 'round' }, paint: { 'line-color': G.river, 'line-width': wide([[8, 0.8], [14, 3], [18, 9]]) } },
      { id: 'building', type: 'fill', source: src, 'source-layer': 'building', minzoom: 13.5, paint: { 'fill-color': G.building, 'fill-outline-color': G.buildingEdge, 'fill-opacity': ['interpolate', ['linear'], Zm, 13.5, 0, 15, 1] } },
      ...road('minor', ['minor', 'service', 'track'], 14, [[13, 0.6], [15, 2.4], [17, 7], [20, 24]], G.road, G.roadEdge),
      ...road('mid', ['tertiary', 'secondary'], 10.5, [[10.5, 0.8], [13, 2.2], [15, 5], [17, 11], [20, 34]], G.road, G.roadEdge),
      ...road('main', ['primary', 'trunk'], 8, [[8, 0.9], [11, 2.2], [14, 5.5], [17, 13], [20, 40]], G.main, G.mainEdge),
      ...road('motor', ['motorway'], 6, [[6, 1], [10, 2.4], [13, 5], [16, 11], [20, 42]], G.motor, G.motorEdge),
      label('label-water', 'water_name', ['==', ['geometry-type'], 'Point'], 6, 13, { layout: { 'text-font': ['Noto Sans Italic'] }, paint: { 'text-color': G.waterInk } }),
      label('label-country', 'place', cls('country'), 2, ['interpolate', ['linear'], Zm, 2, 12, 6, 18], { layout: { 'text-transform': 'uppercase', 'text-letter-spacing': 0.1 } }),
      label('label-state', 'place', cls('state'), 5, 12, { layout: { 'text-transform': 'uppercase' }, paint: { 'text-color': '#8a7fb8' } }),
      label('label-city', 'place', cls('city'), 4, ['interpolate', ['exponential', 1.3], Zm, 4, 13, 8, 18, 12, 26]),
      label('label-town', 'place', cls('town'), 8, ['interpolate', ['linear'], Zm, 8, 12, 13, 18]),
      label('label-village', 'place', cls('village', 'hamlet'), 11, ['interpolate', ['linear'], Zm, 11, 11, 15, 15], { paint: { 'text-color': '#6f639f' } }),
      label('label-suburb', 'place', cls('suburb', 'neighbourhood', 'quarter'), 12, ['interpolate', ['linear'], Zm, 12, 11, 16, 16], { paint: { 'text-color': '#8a7fb8' } }),
    ];
    return { version: 8, sources: { [src]: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' } }, glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf', layers };
  }
  // 이동 선을 얹을 레이어(스타일이 바뀌면 다시 만든다)
  function setupRoutes() {
    const m = cv.map;
    if (!m.getSource('cv-routes')) m.addSource('cv-routes', { type: 'geojson', data: cv.routeData || EMPTY_FC });
    if (!m.getLayer('cv-routes-casing')) m.addLayer({ id: 'cv-routes-casing', type: 'line', source: 'cv-routes', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#ffffff', 'line-width': 10, 'line-opacity': 0.9 } });
    if (!m.getLayer('cv-routes-line')) m.addLayer({ id: 'cv-routes-line', type: 'line', source: 'cv-routes', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': ['get', 'color'], 'line-width': 5.5, 'line-dasharray': [0.1, 1.7] } });
  }
  function setRoutes(fc) {
    cv.routeData = fc;
    const src = cv.map && cv.map.getSource && cv.map.getSource('cv-routes');
    if (src) src.setData(fc);
  }
  // 이동 선을 출발지부터 차례로 그려 나간다
  function animateRoutes(segs) {
    cancelAnimationFrame(cv.routeRaf);
    const line = (s, f) => ({ type: 'Feature', properties: { color: s.color }, geometry: { type: 'LineString', coordinates: [s.a, f >= 1 ? s.b : [s.a[0] + (s.b[0] - s.a[0]) * f, s.a[1] + (s.b[1] - s.a[1]) * f]] } });
    const N = segs.length;
    if (!N) { setRoutes(EMPTY_FC); return; }
    if (reduceMotion) { setRoutes({ type: 'FeatureCollection', features: segs.map((s) => line(s, 1)) }); return; }
    setRoutes(EMPTY_FC);
    const dur = Math.min(2400, 600 + N * 280);
    let t0 = null, last = 0;
    const tick = (now) => {
      if (t0 === null) t0 = now;
      const t = Math.min(1, (now - t0) / dur), p = easeIO(t) * N;
      if (t < 1 && now - last < 50) { cv.routeRaf = requestAnimationFrame(tick); return; } // 초당 20번 정도만 갱신(지도가 무거운 기기 배려)
      last = now;
      const feats = [];
      for (let i = 0; i < N; i++) { if (p >= i + 1) feats.push(line(segs[i], 1)); else if (p > i) feats.push(line(segs[i], p - i)); }
      setRoutes({ type: 'FeatureCollection', features: feats });
      if (t < 1) cv.routeRaf = requestAnimationFrame(tick);
    };
    cv.routeRaf = requestAnimationFrame(tick);
  }

  // 지도는 스타일을 받은 뒤에 만든다. 만드는 동안 renderCityMap은 '불러오는 중'을 보이고, 만들어지면 다시 그린다.
  async function createCityMap() {
    if (!window.maplibregl) return false;
    const style = gameStyle();
    cv.raster = false;
    try {
      cv.map = new maplibregl.Map({ container: 'cvMap', style, center: [10, 30], zoom: 1.6, maxPitch: 0, dragRotate: false, attributionControl: false, fadeDuration: 150 });
    } catch (e) { console.warn('city map failed', e && e.message); cv.map = null; return false; }
    const m = cv.map;
    m.addControl(new maplibregl.AttributionControl({ compact: true }));
    m.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
    m.touchZoomRotate.disableRotation();
    let loaded = false;
    const useRaster = () => { if (cv.raster) return; cv.raster = true; m.setStyle(RASTER_STYLE); }; // 벡터 지도가 안 불러와지면 OSM 기본 지도로
    m.on('style.load', () => { setupRoutes(); });
    m.on('load', () => { loaded = true; });
    setTimeout(() => { if (!loaded) useRaster(); }, 30000);
    cv.labels = () => { $('#cvMap').style.setProperty('--ps', pinScale()); declutter(); };
    m.on('moveend', cv.labels);
    m.on('zoomend', cv.labels);
    return true;
  }
  // 지도가 있으면 true, 만드는 중이면 false(만들어진 뒤 알아서 다시 그림)
  function ensureCityMap() {
    if (cv.map) return true;
    if (!cv.mapPromise) cv.mapPromise = createCityMap().then((ok) => { if (!ok) cv.mapPromise = null; if (!cityView.hidden) renderCityMap(); return ok; });
    return false;
  }
  // 장소들이 화면에 들어오게 카메라를 옮긴다(멀리서 날아오는 애니메이션)
  function flyToPlaces(places, opt = {}) {
    if (!cv.map || !places.length) return;
    const pts = places.map((p) => [p.place.lng, p.place.lat]);
    const b = pts.reduce((bb, pt) => bb.extend(pt), new maplibregl.LngLatBounds(pts[0], pts[0]));
    const narrow = window.innerWidth <= 520;
    const cam = cv.map.cameraForBounds(b, { padding: { top: narrow ? 50 : 70, left: narrow ? 50 : 80, right: narrow ? 50 : 80, bottom: narrow ? 70 : 100 }, maxZoom: opt.maxZoom || 16 });
    if (!cam) return;
    const to = { center: cam.center, zoom: cam.zoom, essential: true };
    if (opt.jump || reduceMotion) cv.map.jumpTo(to);
    else cv.map.flyTo(Object.assign(to, { duration: opt.duration || 2400, curve: 1.6 }));
  }
  // 도시에서 멀리 떨어진 외곽 장소(예: 런던 시내 + 왓포드 스튜디오)가 있으면 처음엔 도심에 맞춰 확대한다
  function coreOf(places) {
    if (places.length < 4) return places;
    const med = (a) => a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)];
    const m = { lat: med(places.map((p) => p.place.lat)), lng: med(places.map((p) => p.place.lng)) };
    const core = places.filter((p) => L.haversine(m, p.place) <= 15);
    return core.length >= 2 ? core : places;
  }

  // 목록 카드: 사진(없으면 색+이모지) + 이름 + 종류
  function makeCard(o) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'cv-item';
    const th = document.createElement('div'); th.className = 'cv-thumb';
    const img = document.createElement('div'); img.className = 'cv-img';
    th.appendChild(img);
    if (o.color) { const d = document.createElement('span'); d.className = 'cv-dot'; d.style.background = o.color; th.appendChild(d); }
    fillPhoto(img, o.name, o.photo, o.K);
    const box = document.createElement('div'); box.className = 't';
    const nm = document.createElement('b'); nm.textContent = o.name;
    box.appendChild(nm);
    o.sub.filter(Boolean).forEach((t) => { const s = document.createElement('span'); s.textContent = t; box.appendChild(s); });
    b.append(th, box);
    b._setPhoto = (photo) => fillPhoto(img, o.name, photo, o.K);
    return b;
  }

  function renderCityMap() {
    cvList.textContent = ''; cv.title = null; cv.items = []; cv.onPhoto = null;
    cv.markers.forEach((m) => m.remove()); cv.markers.clear();
    if (cv.openPop) cv.openPop.remove();
    const ok = ensureCityMap();
    const vis = visibleClusters();
    if (!ok) {
      const p = document.createElement('p'); p.className = 'cv-empty';
      p.textContent = window.maplibregl ? '지도를 불러오는 중…' : '이 브라우저에서는 지도를 그릴 수 없어요(WebGL이 필요해요).';
      cvList.appendChild(p); return;
    }
    cancelAnimationFrame(cv.routeRaf); setRoutes(EMPTY_FC);
    if (!vis.length) {
      const p = document.createElement('p'); p.className = 'cv-empty';
      p.textContent = events.length ? '계획에 랜드마크·박물관 같은 볼거리가 없어요. (공항·역·숙소·식당은 표시하지 않아요)' : '먼저 여행 계획을 적고 적용해 주세요.';
      cvList.appendChild(p); return;
    }
    const c = cv.city === null ? null : vis.find((x) => x.id === cv.city);
    if (!c) { renderOverview(vis); return; }
    const first = !cv.flown; cv.flown = true;

    // 하루 안에서 이어서 가는 순서(공항·역은 건너뛰고 볼거리끼리 잇는다)
    const segs = [];
    let prev = null;
    cv.stops.forEach((st) => {
      if (c.byKey.has(st.key)) {
        if (prev && prev.key !== st.key) {
          const day = [...st.days].find((d) => prev.days.has(d));
          if (day) segs.push({ a: [prev.place.lng, prev.place.lat], b: [st.place.lng, st.place.lat], color: dayColor(day) });
        }
        prev = st;
      } else if (cv.sightKeys.has(st.key)) prev = null; // 다른 도시의 볼거리
    });

    // 사진 핀(번호=방문 순서, 테두리 색=처음 가는 일차)
    c.places.forEach((pl, i) => {
      const el = makePin(placePin(pl), i);
      const m = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([pl.place.lng, pl.place.lat]).setPopup(makePopup(pl)).addTo(cv.map);
      cv.markers.set(pl.key, m); cv.items.push(pl);
    });

    // 오른쪽(모바일은 아래) 사진 카드 목록
    const days = [...new Set(c.places.flatMap((pl) => pl.visits.map((v) => v.day)))].sort((a, b) => a - b);
    const head = document.createElement('div'); head.className = 'cv-listhead';
    const t = document.createElement('strong'); t.textContent = cityTitle(c); cv.title = t;
    const fit = document.createElement('button'); fit.type = 'button'; fit.className = 'qb'; fit.textContent = '모두 보기';
    fit.addEventListener('click', () => { if (cv.openPop) cv.openPop.remove(); flyToPlaces(c.places, { duration: 1600 }); highlight(null); });
    head.append(t, fit);
    days.forEach((d) => { const s = document.createElement('span'); s.className = 'cv-day'; const i = document.createElement('i'); i.style.background = dayColor(d); s.append(i, `${d}일차`); head.appendChild(s); });
    cvList.appendChild(head);
    const core = coreOf(c.places);
    const notes = [];
    if (core.length < c.places.length) notes.push(`도심에서 먼 ${c.places.length - core.length}곳은 처음 화면 밖에 있어요. 카드를 누르거나 '모두 보기'로 확인하세요.`);
    if (cv.hidden) notes.push('공항·역·숙소·식당은 표시하지 않아요.');
    if (notes.length) { const p = document.createElement('p'); p.className = 'cv-note'; p.textContent = notes.join(' '); cvList.appendChild(p); }
    const grid = document.createElement('div'); grid.className = 'cv-grid'; cvList.appendChild(grid);
    const cards = new Map();
    c.places.forEach((pl) => {
      const K = KINDS[pl.kind];
      const b = makeCard({ color: dayColor(pl.visits[0].day), name: pl.name, K, photo: pl.photo, sub: [`${K.emoji} ${K.ko}`, pl.visits.map((v) => `${v.day}일차 ${v.when}`).join(' · '), pl.visits.map((v) => v.memo).find(Boolean)] });
      b.dataset.key = pl.key;
      b.addEventListener('click', () => {
        highlight(pl.key);
        const m = cv.markers.get(pl.key);
        cv.map.flyTo({ center: [pl.place.lng, pl.place.lat], zoom: Math.max(cv.map.getZoom(), 16), essential: true, duration: reduceMotion ? 0 : 1400 });
        cv.map.once('moveend', () => { const pop = m.getPopup(); if (pop && !pop.isOpen()) m.togglePopup(); });
      });
      grid.appendChild(b); cards.set(pl.key, b);
    });
    // 핀을 눌렀을 때도 카드가 강조된다(makePopup의 open에서 highlight 호출)
    cv.onPhoto = (pl) => {
      const m = cv.markers.get(pl.key), b = cards.get(pl.key);
      if (m) updatePin(m.getElement(), placePin(pl));
      if (b) b._setPhoto(pl.photo);
      declutterSoon();
    };
    cv.map.resize();
    // 처음에는 지구 전체에서 그 도시로 날아 들어오고, 도착하면 이동 선이 그려진다
    flyToPlaces(core, { jump: false, duration: first ? 3400 : 2400 });
    setTimeout(() => { if (cv.city === c.id && !cityView.hidden) animateRoutes(segs); }, reduceMotion ? 0 : (first ? 2200 : 1400));
    ensurePhotos(c.places, (pl) => { if (cv.onPhoto && !cityView.hidden) cv.onPhoto(pl); });
  }
  function highlight(key) {
    cvList.querySelectorAll('.cv-item').forEach((b) => {
      const on = b.dataset.key === key;
      b.classList.toggle('on', on);
      if (on) b.scrollIntoView({ block: 'nearest' });
    });
  }
  // 도시를 아직 안 골랐을 때: 도시마다 대표 사진 핀 하나
  function renderOverview(vis) {
    const head = document.createElement('div'); head.className = 'cv-listhead';
    const t = document.createElement('strong'); t.textContent = `${cv.country || '전체 나라'} — ${vis.length}개 도시`; head.appendChild(t);
    cvList.appendChild(head);
    const grid = document.createElement('div'); grid.className = 'cv-grid'; cvList.appendChild(grid);
    const parts = new Map();
    const first = !cv.flown; cv.flown = true;
    vis.forEach((c, i) => {
      const key = `c${c.id}`;
      const el = makePin(cityPin(c), i);
      el.addEventListener('click', () => selectCity(c.id));
      const m = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([c.center.lng, c.center.lat]).addTo(cv.map);
      cv.markers.set(key, m); cv.items.push({ key });
      const b = makeCard({
        color: theme.accent, name: c.name, K: KINDS.landmark, photo: c.places[0].photo,
        sub: [c.country || (c.pending ? '나라 확인 중…' : ''), c.places.slice(0, 4).map((p) => p.name).join(', ') + (c.places.length > 4 ? ' 외' : '')],
      });
      b.addEventListener('click', () => selectCity(c.id));
      grid.appendChild(b);
      parts.set(c.places[0].key, { m, b, c });
    });
    cv.onPhoto = (pl) => {
      const x = parts.get(pl.key);
      if (x) { updatePin(x.m.getElement(), cityPin(x.c)); x.b._setPhoto(pl.photo); }
      declutterSoon();
    };
    cv.map.resize();
    flyToPlaces(vis.flatMap((c) => c.places), { flat: true, maxZoom: 12, jump: first, duration: 2200 });
    ensurePhotos(vis.map((c) => c.places[0]), (pl) => { if (cv.onPhoto && !cityView.hidden) cv.onPhoto(pl); });
  }

  function openCity() {
    closeSearch(); closeSheet();
    cityView.hidden = false;
    $('#cityBtn').setAttribute('aria-expanded', 'true');
    ensureCityMap();
    if (!events.length) { renderCityNav(); renderCityMap(); return; }
    prepareCity();
    if (cv.map) cv.map.resize();
    renderCityNav(); renderCityMap();
    const run = ++cv.run;
    if (cv.clusters.some((c) => c.pending)) nameCities(run);
  }
  function closeCity() {
    cv.run++;
    cityView.hidden = true;
    $('#cityBtn').setAttribute('aria-expanded', 'false');
  }
  // 계획이 새로 적용되면 도시 목록을 다시 만든다(도시 지도가 열려 있으면 바로 갱신)
  function cityPlanChanged() {
    cv.dirty = true;
    refreshPins();
    if (!cityView.hidden) openCity();
  }
  function prepareCity() {
    if (!cv.dirty) return;
    buildCityData(); cv.country = ''; cv.city = cv.clusters.length ? cv.clusters[0].id : null;
  }

  // ---------- 메인 지도 위 사진 핀: 계획에 있는 볼거리마다 실제 사진 핀(도시별 지도와 같은 모양) ----------
  // 핀은 캔버스 아래 층에 있고, 위치는 지도(2D·3D 모두)의 투영으로 매 프레임 옮긴다. 누르면 장소 설명 카드가 열린다.
  const mp = { list: [], vis: new Set(), rects: [], run: 0, started: false, shown: true };
  const PIN_MIN_ZOOM = 9.5; // 이보다 멀리서 보면 핀을 감춘다(나라·대륙 규모에서는 점만)
  function refreshPins() {
    const layer = $('#pinLayer');
    layer.textContent = ''; mp.list = []; mp.vis = new Set(); mp.rects = []; mp.started = false; mp.run++;
    if (!events.length) return;
    prepareCity();
    cv.clusters.forEach((c) => c.places.forEach((pl) => {
      const el = makePin(placePin(pl), 0);
      el.classList.add('hide');
      el.addEventListener('click', () => openPlaceInfo(pl.place));
      layer.appendChild(el);
      mp.list.push({ pl, el, lbl: el.querySelector('.cv-lbl'), x: L.mx(pl.place.lng), y: L.my(pl.place.lat), ps: 0, hidden: true, lblOff: null });
    }));
  }
  function startPinPhotos() {
    mp.started = true;
    const run = mp.run, byKey = new Map(mp.list.map((it) => [it.pl.key, it]));
    ensurePhotos(mp.list.map((it) => it.pl), (pl) => {
      const it = byKey.get(pl.key);
      if (it && run === mp.run) updatePin(it.el, placePin(pl));
    });
  }
  function updatePins(cur) {
    const layer = $('#pinLayer');
    const zoom = map.getZoom();
    const on = mp.list.length > 0 && zoom >= PIN_MIN_ZOOM && (!cityView || cityView.hidden);
    if (!on) {
      if (mp.shown) { layer.style.display = 'none'; mp.shown = false; mp.vis = new Set(); mp.rects = []; }
      return;
    }
    if (!mp.shown) { layer.style.display = ''; mp.shown = true; }
    if (!mp.started) startPinPhotos();
    const Z = Math.exp(cam.lz), tilt = g3.p > 0.001;
    toScreen(cur.x, cur.y, Z); const chX = PX, chY = PY; // 캐릭터가 서 있는 자리
    const base = (window.innerWidth <= 520 ? 0.8 : 1) * (zoom >= 13 ? 1 : zoom >= 11.5 ? 0.82 : 0.66);
    const inView = [];
    for (const it of mp.list) {
      toScreen(it.x, it.y, Z);
      const ps = base * (tilt ? Math.max(0.55, Math.min(1.15, 0.5 + 0.75 * (PY / H))) : 1); // 3D에서는 멀리(위쪽) 있는 핀이 작게
      it.sx = PX; it.sy = PY; it.nps = ps;
      if (Math.abs(PX - chX) < 26 && Math.abs(PY - chY) < 26) it.sy -= 46 * ps; // 캐릭터가 사진을 가리지 않게 머리 위로 올린다
      it.pri = it.pl.key === cur.toKey || it.pl.key === cur.fromKey ? 0 : it.pl.visits.some((v) => v.day === cur.day) ? 1 : 2;
      const ok = PX > -40 && PX < W + 40 && PY > hud.top + 24 && PY < H - hud.bottom + 70;
      if (ok) inView.push(it); else it.want = false;
    }
    // 겹치는 핀은 지금 일차·현재 장소 것을 먼저 남기고 나머지는 감춘다(확대하면 다 나온다)
    inView.sort((a, b) => a.pri - b.pri || b.sy - a.sy);
    const kept = [], vis = new Set(), rects = [];
    for (const it of inView) {
      const w = 64 * it.nps, h = 76 * it.nps, r = { x: it.sx - w / 2, y: it.sy - h, w, h };
      it.want = !kept.some((q) => r.x < q.x + q.w - 4 && q.x < r.x + r.w - 4 && r.y < q.y + q.h - 4 && q.y < r.y + r.h - 4);
      if (it.want) { kept.push(r); vis.add(it.pl.key); rects.push([r.x, r.y, r.w, r.h + 22]); it.lblWant = it.pri <= 1 || zoom >= 14; }
    }
    mp.vis = vis; mp.rects = rects;
    for (const it of mp.list) {
      const hide = !it.want;
      if (hide !== it.hidden) { it.hidden = hide; it.el.classList.toggle('hide', hide); }
      if (hide) continue;
      it.el.style.transform = `translate(${it.sx.toFixed(1)}px, ${it.sy.toFixed(1)}px)`;
      if (Math.abs(it.nps - it.ps) > 0.01) { it.ps = it.nps; it.el.style.setProperty('--ps', it.nps.toFixed(3)); }
      const off = !it.lblWant;
      if (off !== it.lblOff) { it.lblOff = off; if (it.lbl) it.lbl.classList.toggle('off', off); }
      it.el.style.zIndex = String(1000 - it.pri * 100 + Math.round(it.sy / 10)); // 지금 가는 곳이 위, 같으면 아래쪽(가까운) 핀이 위
    }
  }
  $('#cityBtn').addEventListener('click', () => (cityView.hidden ? openCity() : closeCity()));
  $('#cvClose').addEventListener('click', closeCity);
  cvCountry.addEventListener('change', () => {
    cv.country = cvCountry.value;
    const vis = visibleClusters();
    cv.city = cv.country && vis.length ? vis[0].id : null;
    renderCityNav(); renderCityMap();
  });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !cityView.hidden && $('#placeInfo').hidden) closeCity(); });

  // ---------- 시작 ----------
  try {
    const saved = JSON.parse(store.get('tripmap:char') || 'null');
    if (saved && typeof saved.name === 'string') { char.name = saved.name; if (HATS.includes(saved.hat)) char.hat = saved.hat; }
  } catch (e) { /* 무시 */ }
  $('#charName').value = char.name;
  updateTitle(); renderHats(); updateAutoBtn();
  closeSheet();
  resize();
  applyPlan(DEFAULT_PLAN);
  requestAnimationFrame(frame);
  window.__trip = { ctl, cam, map, roadStat, go, applyPlan, dims: () => ({ W, H, DPR }), events: () => events, cityMap: () => cv.map };
})();

</script>
</body>
</html>
